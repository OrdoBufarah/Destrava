<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFD21F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Destrava Kids">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="icon" href="/icon-192.png">
<title>Destrava Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a vertical adventure map of round level nodes; tapping one opens a full-screen mini-game with a sun mascot. Bright single look by design. */
:root{
  --sun:#FFD21F; --sun-deep:#F5B300; --sky:#FFF6CF; --ink:#2A2141; --muted:#6E6488; --white:#FFFFFF;
  --good:#22C55E; --good-deep:#15803D; --pink:#FF6FA8; --blue:#4CA8FF; --violet:#9B6BFF; --orange:#FF8A3D; --lock:#D9D3C2;
  --font:"Fredoka", "Avenir Next Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font:500 18px/1.35 var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}

/* ---------- top bar ---------- */
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:calc(env(safe-area-inset-top,0px) + 12px) 10px;background:var(--sun);border-radius:0 0 28px 28px;box-shadow:0 6px 0 var(--sun-deep)}
.back{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center}
.back svg{width:24px;height:24px}
.brand{display:flex;flex-direction:column;align-items:center;line-height:1}
.brand b{font-size:26px;font-weight:700;letter-spacing:-.01em}
.brand span{font-size:13px;font-weight:700;letter-spacing:.2em;color:var(--violet)}
.pills{display:flex;gap:6px}
.pill{display:flex;align-items:center;gap:4px;background:var(--white);border-radius:999px;padding:6px 10px;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.pill i{font-style:normal}

/* ---------- map ---------- */
.map{flex:1;min-height:0;overflow-y:auto;padding-block:20px 40px;background:
  radial-gradient(circle at 15% 12%, #fff 0 18px, transparent 19px),
  radial-gradient(circle at 85% 30%, #fff 0 14px, transparent 15px),
  radial-gradient(circle at 20% 62%, #fff 0 12px, transparent 13px),
  radial-gradient(circle at 80% 82%, #fff 0 16px, transparent 17px), var(--sky)}
.hello{max-width:460px;margin:0 auto 18px;display:flex;align-items:center;gap:12px;background:var(--white);border-radius:24px;padding:12px 14px;box-shadow:0 5px 0 rgba(42,33,65,.08)}
.hello .mascot{width:64px;height:64px;flex:none}
.hello p{margin:0;font-size:17px}
.path{position:relative;max-width:420px;margin:0 auto;display:flex;flex-direction:column;align-items:center;gap:22px}
.world{width:100%;display:flex;flex-direction:column;align-items:center;gap:22px}
.wtitle{margin-bottom:22px;background:var(--white);border-radius:999px;padding:6px 16px;font-weight:700;font-size:15px;color:var(--muted);box-shadow:0 3px 0 rgba(42,33,65,.08)}
.node{position:relative;width:92px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:var(--c,var(--orange));box-shadow:0 8px 0 rgba(0,0,0,.18), inset 0 -6px 0 rgba(0,0,0,.12);transition:transform .12s}
.node:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.18), inset 0 -6px 0 rgba(0,0,0,.12)}
.node.locked{background:var(--lock);filter:grayscale(1);opacity:.75}
.node .lk{position:absolute;right:-4px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:var(--white);display:grid;place-items:center;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.15)}
.node .stars{position:absolute;bottom:-26px;left:50%;transform:translateX(-50%);font-size:16px;letter-spacing:-2px;white-space:nowrap}
.node.current::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:5px solid var(--white);animation:ring 1.4s ease-in-out infinite}
.node .go{position:absolute;top:-38px;left:50%;transform:translateX(-50%);background:var(--white);color:var(--violet);font-size:15px;font-weight:700;padding:4px 12px;border-radius:12px;box-shadow:0 3px 0 rgba(0,0,0,.1);white-space:nowrap;animation:bob 1.2s ease-in-out infinite}
.node .go::after{content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);border:7px solid transparent;border-top-color:var(--white);border-bottom:0}
.trophy{font-size:44px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.12))}
@keyframes ring{0%,100%{transform:scale(1);opacity:.9}50%{transform:scale(1.08);opacity:.5}}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}

/* ---------- play ---------- */
#play{background:linear-gradient(180deg,#FFF3B0 0%,#FFE680 100%)}
.ptop{flex:none;display:flex;align-items:center;gap:12px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) 8px}
.bar{flex:1;height:20px;background:rgba(255,255,255,.75);border-radius:999px;overflow:hidden;box-shadow:inset 0 3px 0 rgba(0,0,0,.06)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(180deg,#5BE38A,var(--good));border-radius:999px;transition:width .4s cubic-bezier(.3,1.4,.5,1)}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;max-width:520px;width:100%;margin:0 auto;padding-block:8px}
.talk{display:flex;align-items:flex-end;gap:10px;width:100%}
.talk .mascot{width:84px;height:84px;flex:none}
.bubble{position:relative;flex:1;background:var(--white);border-radius:22px;padding:12px 16px;font-size:20px;font-weight:600;box-shadow:0 5px 0 rgba(42,33,65,.08);min-height:56px}
.bubble::before{content:"";position:absolute;left:-10px;bottom:16px;border:10px solid transparent;border-right-color:var(--white);border-left:0}
.bubble small{display:block;color:var(--muted);font-size:15px;font-weight:500}
.replay{display:inline-flex;align-items:center;gap:6px;background:var(--blue);color:#fff;border-radius:999px;padding:8px 16px;font-weight:700;box-shadow:0 4px 0 #2B7FD0}
.replay svg{width:20px;height:20px}
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:100%}
.card{aspect-ratio:1.1;max-width:100%;background:var(--white);border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:64px;line-height:1;box-shadow:0 7px 0 rgba(42,33,65,.12);transition:transform .12s}
.card:active{transform:translateY(4px);box-shadow:0 3px 0 rgba(42,33,65,.12)}
.card small{font-size:15px;color:var(--muted);font-weight:600}
.card.right{background:#D9FBE5;box-shadow:0 7px 0 var(--good);animation:pop .4s}
.card.wrong{animation:shake .4s;opacity:.45}
@keyframes pop{50%{transform:scale(1.08)}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.big{font-size:120px;line-height:1;filter:drop-shadow(0 8px 0 rgba(0,0,0,.08));animation:pop .5s}
.word{font-size:40px;font-weight:700;letter-spacing:.01em;color:var(--violet)}
.mic{width:110px;height:110px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;box-shadow:0 8px 0 #D2457F}
.mic svg{width:48px;height:48px}
.mic.on{background:var(--good);box-shadow:0 8px 0 var(--good-deep);animation:ring 1s infinite}
.heard{min-height:1.4em;font-size:17px;color:var(--muted);text-align:center}
.alt{background:var(--white);border-radius:999px;padding:10px 18px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.1)}

/* ---------- result ---------- */
#done{background:linear-gradient(180deg,#FFE680,#FFC93C);align-items:center;justify-content:center;text-align:center;gap:14px}
#done h1{font-size:40px;margin:0;font-weight:700}
.bigstars{font-size:64px;letter-spacing:6px}
.bigstars span{display:inline-block;animation:starIn .5s both}
.bigstars span:nth-child(2){animation-delay:.25s}.bigstars span:nth-child(3){animation-delay:.5s}
.bigstars .off{filter:grayscale(1);opacity:.35}
@keyframes starIn{from{transform:scale(0) rotate(-90deg)}to{transform:none}}
.cta{background:var(--good);color:#fff;font-size:24px;font-weight:700;border-radius:24px;padding:16px 36px;box-shadow:0 7px 0 var(--good-deep)}
.cta:active{transform:translateY(4px);box-shadow:0 3px 0 var(--good-deep)}
.learned{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:420px}
.learned span{background:rgba(255,255,255,.8);border-radius:999px;padding:5px 12px;font-size:16px;font-weight:600}

/* ---------- name sheet ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(42,33,65,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--sky);width:100%;max-width:520px;border-radius:30px 30px 0 0;padding-block:24px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.panel h2{margin:0;font-size:28px}
.panel p{margin:0;color:var(--muted)}
.panel input{width:100%;max-width:320px;border:3px solid var(--sun-deep);border-radius:18px;padding:14px;font:600 22px var(--font);text-align:center;color:var(--ink);background:#fff}
.note{font-size:14px;color:var(--muted)}

canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="sunny" viewBox="0 0 100 100">
    <g stroke="#F5B300" stroke-width="7" stroke-linecap="round">
      <path d="M50 4v11M50 85v11M4 50h11M85 50h11M17 17l8 8M75 75l8 8M83 17l-8 8M25 75l-8 8"/>
    </g>
    <circle cx="50" cy="50" r="31" fill="#FFD21F" stroke="#F5B300" stroke-width="4"/>
    <circle cx="39" cy="46" r="5" fill="#2A2141"/><circle cx="61" cy="46" r="5" fill="#2A2141"/>
    <circle cx="40.5" cy="44.5" r="1.6" fill="#fff"/><circle cx="62.5" cy="44.5" r="1.6" fill="#fff"/>
    <circle cx="31" cy="56" r="5" fill="#FF8FB8" opacity=".7"/><circle cx="69" cy="56" r="5" fill="#FF8FB8" opacity=".7"/>
    <path d="M38 58q12 12 24 0" fill="none" stroke="#2A2141" stroke-width="4.5" stroke-linecap="round"/>
  </symbol>
</svg>

<!-- ===== MAP ===== -->
<section class="screen" id="home">
  <div class="top gut">
    <a class="back" href="/" aria-label="Voltar para o Destrava"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div class="brand"><b>Destrava</b><span>KIDS</span></div>
    <div class="pills"><span class="pill"><i>⭐</i><span id="starCount">0</span></span><span class="pill"><i>🔥</i><span id="streak">0</span></span></div>
  </div>
  <div class="map gut" id="map">
    <div class="hello"><svg class="mascot"><use href="#sunny"/></svg><p id="helloTxt">Oi! Eu sou o <b>Solzinho</b>. Bora aprender inglês brincando?</p></div>
    <div class="path" id="path"></div>
  </div>
</section>

<!-- ===== PLAY ===== -->
<section class="screen" id="play" hidden>
  <div class="ptop gut">
    <button class="back" id="quit" aria-label="Sair da fase"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="bar"><i id="bar"></i></div>
    <span class="pill"><i>⭐</i><span id="roundStars">0</span></span>
  </div>
  <div class="stage gut" id="stage"></div>
</section>

<!-- ===== RESULT ===== -->
<section class="screen gut" id="done" hidden>
  <svg class="mascot" style="width:110px;height:110px"><use href="#sunny"/></svg>
  <h1 id="doneTitle">Fase completa!</h1>
  <div class="bigstars" id="bigStars"></div>
  <div class="learned" id="learned"></div>
  <button class="cta" id="next">Continuar</button>
</section>

<!-- ===== NAME ===== -->
<div class="sheet" id="nameSheet" hidden>
  <div class="panel gut">
    <svg style="width:96px;height:96px"><use href="#sunny"/></svg>
    <h2>Qual é o seu nome?</h2>
    <input id="kidName" maxlength="20" autocomplete="off" placeholder="Seu nome" aria-label="Nome da criança">
    <button class="cta" id="nameGo">Vamos lá!</button>
    <p class="note">Para os pais: o progresso fica salvo só neste aparelho.</p>
  </div>
</div>

<canvas id="fx"></canvas>

<script>
(() => {
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ---------- curriculum: worlds → phases → words ---------- */
const WORLDS = [
  { name:"Mundo 1 · Primeiras palavras", phases:[
    { id:"animals",  title:"Animais",  icon:"🐶", c:"#FF8A3D", words:[["dog","cachorro","🐶"],["cat","gato","🐱"],["fish","peixe","🐟"],["bird","pássaro","🐦"],["horse","cavalo","🐴"]] },
    { id:"colors",   title:"Cores",    icon:"🎨", c:"#FF6FA8", words:[["red","vermelho","🟥"],["blue","azul","🟦"],["yellow","amarelo","🟨"],["green","verde","🟩"],["orange","laranja","🟧"]] },
    { id:"numbers",  title:"Números",  icon:"🔢", c:"#4CA8FF", words:[["one","um","1️⃣"],["two","dois","2️⃣"],["three","três","3️⃣"],["four","quatro","4️⃣"],["five","cinco","5️⃣"]] },
    { id:"fruits",   title:"Frutas",   icon:"🍎", c:"#22C55E", words:[["apple","maçã","🍎"],["banana","banana","🍌"],["grapes","uva","🍇"],["strawberry","morango","🍓"],["orange","laranja","🍊"]] },
  ]},
  { name:"Mundo 2 · Minha casa", phases:[
    { id:"family",   title:"Família",  icon:"👨‍👩‍👧‍👦", c:"#9B6BFF", words:[["mom","mamãe","👩"],["dad","papai","👨"],["baby","bebê","👶"],["brother","irmão","👦"],["sister","irmã","👧"]] },
    { id:"body",     title:"Corpo",    icon:"🖐️", c:"#FF8A3D", words:[["hand","mão","✋"],["eye","olho","👁️"],["nose","nariz","👃"],["mouth","boca","👄"],["foot","pé","🦶"]] },
    { id:"toys",     title:"Brinquedos", icon:"🧸", c:"#FF6FA8", words:[["ball","bola","⚽"],["car","carro","🚗"],["teddy bear","ursinho","🧸"],["kite","pipa","🪁"],["robot","robô","🤖"]] },
    { id:"food",     title:"Comida",   icon:"🍕", c:"#4CA8FF", words:[["pizza","pizza","🍕"],["milk","leite","🥛"],["bread","pão","🍞"],["cake","bolo","🍰"],["water","água","💧"]] },
  ]},
  { name:"Mundo 3 · Aventura", phases:[
    { id:"clothes",  title:"Roupas",   icon:"👕", c:"#22C55E", words:[["shirt","camiseta","👕"],["shoes","sapatos","👟"],["hat","chapéu","🧢"],["dress","vestido","👗"],["socks","meias","🧦"]] },
    { id:"weather",  title:"Tempo",    icon:"🌦️", c:"#9B6BFF", words:[["sun","sol","☀️"],["rain","chuva","🌧️"],["snow","neve","❄️"],["cloud","nuvem","☁️"],["rainbow","arco-íris","🌈"]] },
    { id:"actions",  title:"Ações",    icon:"🏃", c:"#FF8A3D", words:[["run","correr","🏃"],["jump","pular","🦘"],["sleep","dormir","😴"],["eat","comer","😋"],["swim","nadar","🏊"]] },
    { id:"feelings", title:"Sentimentos", icon:"😀", c:"#FF6FA8", words:[["happy","feliz","😀"],["sad","triste","😢"],["angry","bravo","😠"],["scared","com medo","😨"],["tired","cansado","🥱"]] },
  ]},
  { name:"Mundo 4 · Pelo mundo", phases:[
    { id:"places",   title:"Lugares",  icon:"🏫", c:"#4CA8FF", words:[["school","escola","🏫"],["house","casa","🏠"],["park","parque","🛝"],["beach","praia","🏖️"],["hospital","hospital","🏥"]] },
    { id:"transport",title:"Transportes", icon:"✈️", c:"#22C55E", words:[["plane","avião","✈️"],["bus","ônibus","🚌"],["boat","barco","⛵"],["train","trem","🚆"],["bike","bicicleta","🚲"]] },
    { id:"wild",     title:"Selva",    icon:"🦁", c:"#9B6BFF", words:[["lion","leão","🦁"],["monkey","macaco","🐒"],["elephant","elefante","🐘"],["snake","cobra","🐍"],["tiger","tigre","🐯"]] },
    { id:"phrases",  title:"Frases mágicas", icon:"✨", c:"#FF8A3D", words:[["hello","olá","👋"],["thank you","obrigado","🙏"],["please","por favor","🥺"],["good night","boa noite","🌙"],["I love you","eu te amo","❤️"]] },
  ]},
];
const PHASES = WORLDS.flatMap(w => w.phases);

const PRAISE = ["Muito bem!","Uau, mandou bem!","Isso aí!","Que demais!","Perfeito!","Você é fera!","Arrasou!","Show de bola!"];
const RETRY  = ["Quase! Tenta de novo.","Opa, foi por pouco! Mais uma vez.","Você consegue! Tenta outra."];

/* ---------- state ---------- */
const blank = () => ({ name:"", unlocked:1, stars:{}, streak:0, lastDay:null });
let K = blank();
try { const s = localStorage.getItem("destrava_kids"); if (s) K = Object.assign(blank(), JSON.parse(s)); } catch(e){}
const save = () => { try { localStorage.setItem("destrava_kids", JSON.stringify(K)); } catch(e){} renderTop(); };
const ymd = d => d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
function touchDay(){ const t = ymd(new Date()), y = new Date(); y.setDate(y.getDate()-1); if (K.lastDay !== t){ K.streak = K.lastDay === ymd(y) ? K.streak+1 : 1; K.lastDay = t; } }
const totalStars = () => Object.values(K.stars).reduce((a,b) => a+b, 0);
function renderTop(){ $("#starCount").textContent = totalStars(); $("#streak").textContent = K.streak; }

/* ---------- audio: natural voice from the server, cached; device voice as fallback ---------- */
let actx = null, curSrc = null, cloudOffUntil = 0, seq = 0;
const memCache = new Map();
function unlockAudio(){
  try {
    if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); }
    if (actx.state === "suspended") actx.resume();
    const b = actx.createBuffer(1,1,22050), s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0);
  } catch(e){}
}
["pointerdown","touchend","keydown"].forEach(ev => document.addEventListener(ev, unlockAudio, { passive:true }));
const STYLE = "Você é o Solzinho, um mascote alegre que ensina inglês para crianças brasileiras pequenas. Fale com muita animação, carinho e sorriso na voz, devagar e bem claro. As partes em português têm sotaque brasileiro de Brasília, nunca português de Portugal. As palavras em inglês têm pronúncia americana nativa, bem caprichada. Leia em voz alta exatamente este texto:";
const VOICE = "Puck";
async function getVoice(text){
  const key = VOICE + "|" + text;
  if (memCache.has(key)) return memCache.get(key);
  let bytes = null, cache = null;
  try { cache = await caches.open("destrava-kids-voz-v1"); const hit = await cache.match("/voz/" + encodeURIComponent(key)); if (hit) bytes = await hit.arrayBuffer(); } catch(e){}
  if (!bytes){
    let code = ""; try { code = localStorage.getItem("destrava_code") || ""; } catch(e){}
    const r = await fetch("/api/tts", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ text, voice:VOICE, style:STYLE, code }) });
    if (!r.ok){ const d = await r.json().catch(() => ({})); throw { code: d.error || "tts_error", status:r.status }; }
    bytes = await r.arrayBuffer();
    try { cache && await cache.put("/voz/" + encodeURIComponent(key), new Response(bytes.slice(0), { headers:{ "Content-Type":"audio/wav" } })); } catch(e){}
  }
  const buf = await actx.decodeAudioData(bytes.slice(0));
  memCache.set(key, buf); if (memCache.size > 120) memCache.delete(memCache.keys().next().value);
  return buf;
}
function play(buf, my){
  return new Promise(res => {
    if (my !== seq) return res();
    const s = actx.createBufferSource(); s.buffer = buf; s.connect(actx.destination); curSrc = s;
    s.onended = () => { if (curSrc === s) curSrc = null; res(); };
    try { s.start(0); } catch(e){ res(); }
  });
}
let voices = [];
const loadVoices = () => { try { voices = speechSynthesis.getVoices() || []; } catch(e){} };
if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function deviceSay(text){
  return new Promise(res => {
    if (!("speechSynthesis" in window)) return res();
    const u = new SpeechSynthesisUtterance(text); u.lang = "pt-BR"; u.rate = .95;
    const v = voices.filter(v => (v.lang||"").toLowerCase().replace("_","-") === "pt-br").sort((a,b) => /premium|enhanced|aprimorad|google/i.test(b.name) - /premium|enhanced|aprimorad|google/i.test(a.name))[0];
    if (v) u.voice = v;
    const g = setTimeout(res, 2500 + text.length*110); u.onend = u.onerror = () => { clearTimeout(g); res(); };
    try { speechSynthesis.speak(u); } catch(e){ res(); }
  });
}
async function say(text){
  if (!text) return;
  const my = seq;
  unlockAudio();
  if (actx && Date.now() > cloudOffUntil){
    try { const buf = await getVoice(text); if (my !== seq) return; await play(buf, my); return; }
    catch(e){ if (my !== seq) return; cloudOffUntil = Date.now() + 10*60*1000; }
  }
  if (my === seq) await deviceSay(text);
}
function hush(){ seq++; try { curSrc && curSrc.stop(); } catch(e){} curSrc = null; try { speechSynthesis.cancel(); } catch(e){} }
// warm the cache for a phase so the game feels instant
function prefetch(lines){ if (!actx) return; (async () => { for (const t of lines){ try { await getVoice(t); } catch(e){ return; } } })(); }

/* little sound effects */
function blip(notes){
  if (!actx) return; const t0 = actx.currentTime;
  notes.forEach(([f, d, at]) => { const o = actx.createOscillator(), g = actx.createGain(); o.type = "triangle"; o.frequency.value = f; g.gain.setValueAtTime(0, t0+at); g.gain.linearRampToValueAtTime(.18, t0+at+.01); g.gain.exponentialRampToValueAtTime(.001, t0+at+d); o.connect(g); g.connect(actx.destination); o.start(t0+at); o.stop(t0+at+d+.02); });
}
const ding = () => blip([[660,.14,0],[880,.14,.1],[1320,.25,.2]]);
const boop = () => blip([[300,.18,0],[240,.22,.12]]);
const fanfare = () => blip([[523,.15,0],[659,.15,.15],[784,.15,.3],[1047,.4,.45]]);

/* confetti */
const fx = $("#fx"), fc = fx.getContext("2d"); let bits = [];
function confetti(n = 90){
  const w = fx.width = innerWidth * devicePixelRatio, h = fx.height = innerHeight * devicePixelRatio;
  const cols = ["#FFD21F","#FF6FA8","#4CA8FF","#22C55E","#9B6BFF","#FF8A3D"];
  for (let i = 0; i < n; i++) bits.push({ x:w/2, y:h*.45, vx:(Math.random()-.5)*w*.025, vy:-Math.random()*h*.022-h*.006, r:Math.random()*6.28, vr:(Math.random()-.5)*.3, s:(6+Math.random()*8)*devicePixelRatio, c:pick(cols), life:1 });
  if (bits.length === n) requestAnimationFrame(tick);
}
function tick(){
  fc.clearRect(0,0,fx.width,fx.height);
  bits.forEach(b => { b.x += b.vx; b.y += b.vy; b.vy += fx.height*.0007; b.r += b.vr; b.life -= .008; fc.save(); fc.translate(b.x,b.y); fc.rotate(b.r); fc.globalAlpha = Math.max(0,b.life); fc.fillStyle = b.c; fc.fillRect(-b.s/2,-b.s/3,b.s,b.s*.66); fc.restore(); });
  bits = bits.filter(b => b.life > 0 && b.y < fx.height + 40);
  if (bits.length) requestAnimationFrame(tick); else fc.clearRect(0,0,fx.width,fx.height);
}

/* ---------- speech recognition ---------- */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let srOk = !!SR;
function listenOnce(){
  return new Promise(res => {
    if (!srOk) return res(null);
    let rec, got = [], done = false;
    const finish = v => { if (done) return; done = true; clearTimeout(dog); res(v); };
    const dog = setTimeout(() => { try { rec.abort(); } catch(e){} finish(got); }, 7000);
    try {
      rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.maxAlternatives = 5;
      rec.onresult = ev => { got = []; for (const r of ev.results) for (let i = 0; i < r.length; i++) got.push(r[i].transcript); $("#heard") && ($("#heard").textContent = "🎧 " + (got[0] || "")); };
      rec.onerror = ev => { if (/not-allowed|service-not-allowed|audio-capture/.test(ev.error)) srOk = false; };
      rec.onend = () => finish(srOk ? got : null);
      rec.start();
    } catch(e){ srOk = false; finish(null); }
  });
}
const norm = s => String(s).toLowerCase().replace(/[^a-z ]/g,"").replace(/\s+/g," ").trim();
function lev(a, b){ const m = a.length, n = b.length, d = Array.from({length:m+1}, (_,i) => [i, ...Array(n).fill(0)]); for (let j = 1; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return d[m][n]; }
// kids pronounce freely: accept the word anywhere in what was heard, or a close sound-alike
function matches(heard, target){
  const t = norm(target);
  return (heard || []).some(h => { const x = norm(h); if (!x) return false; if ((" "+x+" ").includes(" "+t+" ")) return true; return x.split(" ").concat([x]).some(w => lev(w, t) <= Math.max(1, Math.floor(t.length * .34))); });
}

/* ---------- map ---------- */
function renderMap(){
  const path = $("#path"); path.textContent = "";
  let idx = 0;
  WORLDS.forEach((w, wi) => {
    const box = el("div","world"); box.append(el("div","wtitle", w.name));
    w.phases.forEach((ph, pi) => {
      idx++;
      const n = idx, locked = n > K.unlocked, current = n === K.unlocked, st = K.stars[ph.id] || 0;
      const b = el("button","node" + (locked ? " locked" : "") + (current ? " current" : ""));
      b.style.setProperty("--c", ph.c); b.textContent = ph.icon;
      b.style.transform = "translateX(" + [0, 70, 0, -70][(n-1) % 4] + "px)";
      b.setAttribute("aria-label", "Fase " + n + ": " + ph.title + (locked ? " (bloqueada)" : ""));
      if (locked){ b.append(el("span","lk","🔒")); }
      else if (st) b.append(el("span","stars","⭐".repeat(st) + "☆".repeat(3-st)));
      if (current) b.append(el("span","go", st ? "DE NOVO!" : "JOGAR!"));
      b.onclick = () => { if (locked){ boop(); say("Essa fase ainda está trancada! Termine a fase anterior para abrir."); return; } startPhase(n-1); };
      box.append(b);
    });
    box.append(el("div","trophy", K.unlocked > (wi+1)*4 ? "🏆" : "🎁"));
    path.append(box);
  });
  requestAnimationFrame(() => { const cur = path.querySelector(".current"); cur && cur.scrollIntoView({ block:"center" }); });
  $("#helloTxt").innerHTML = "";
  $("#helloTxt").append(K.name ? "Oi, " : "Oi! ", ...(K.name ? [Object.assign(el("b"), { textContent:K.name }), "! "] : []), "Escolha uma fase e bora jogar!");
}

/* ---------- game ---------- */
let G = null;
function show(id){ ["#home","#play","#done"].forEach(s => $(s).hidden = s !== id); }
function startPhase(i){
  hush(); unlockAudio(); touchDay(); save();
  const ph = PHASES[i];
  const words = ph.words.map(([en, pt, e]) => ({ en, pt, e }));
  const rounds = shuffle(words).map(w => ({ type:"tap", w })).concat(shuffle(words).slice(0, 3).map(w => ({ type:"say", w })));
  // mix them a little, but always start with listening
  const ordered = [rounds[0], rounds[1], rounds[5], rounds[2], rounds[3], rounds[6], rounds[4], rounds[7]];
  G = { i, ph, words, rounds: ordered, r:0, miss:0, got:0 };
  $("#roundStars").textContent = 0; $("#bar").style.width = "0%";
  show("#play");
  prefetch(words.flatMap(w => ["Toque no " + w.en + "!", w.en + "! " + w.en + " é " + w.pt + "."]));
  intro();
}
async function intro(){
  const st = $("#stage"); st.textContent = "";
  const big = el("div","big", G.ph.icon), t = el("div","word", G.ph.title);
  st.append(talk("Fase de " + G.ph.title + "! Vamos nessa?"), big, t);
  const go = el("button","cta","Começar!"); st.append(go);
  const my = seq;
  say("Fase de " + G.ph.title.toLowerCase() + "! Vamos nessa?");
  go.onclick = () => { if (my === seq) hush(); nextRound(); };
}
function talk(text, sub){
  const box = el("div","talk"); const m = document.createElementNS("http://www.w3.org/2000/svg","svg"); m.setAttribute("class","mascot");
  const u = document.createElementNS("http://www.w3.org/2000/svg","use"); u.setAttribute("href","#sunny"); m.append(u);
  const b = el("div","bubble", text); if (sub) b.append(el("small", null, sub));
  box.append(m, b); return box;
}
function progress(){ $("#bar").style.width = Math.round(G.r / G.rounds.length * 100) + "%"; $("#roundStars").textContent = G.got; }
function nextRound(){
  hush();
  if (G.r >= G.rounds.length) return finish();
  const R = G.rounds[G.r]; progress();
  R.type === "tap" ? tapRound(R.w) : sayRound(R.w);
}
async function win(w, extra){
  G.got++; ding(); confetti(50); $("#roundStars").textContent = G.got;
  await say(pick(PRAISE) + " " + w.en + " é " + w.pt + ".");
  G.r++; await wait(250); nextRound();
}
function tapRound(w){
  const st = $("#stage"); st.textContent = "";
  const prompt = "Toque no " + w.en + "!";
  st.append(talk("Toque no…", "Ouça e escolha a figura certa"));
  const word = el("div","word", w.en); st.append(word);
  const rep = el("button","replay"); rep.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><path d="M4 9v6h4l5 4V5L8 9z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>'; rep.append("Ouvir de novo");
  rep.onclick = () => { hush(); say(prompt); }; st.append(rep);
  const others = shuffle(G.words.filter(x => x.en !== w.en)).slice(0, 3);
  const grid = el("div","cards"); let tries = 0, locked = false;
  shuffle([w, ...others]).forEach(o => {
    const c = el("button","card", o.e); c.setAttribute("aria-label", o.pt);
    c.onclick = async () => {
      if (locked) return;
      if (o.en === w.en){ locked = true; c.classList.add("right"); hush(); await win(w); }
      else { tries++; c.classList.add("wrong"); c.disabled = true; boop(); if (tries === 1) G.miss++; hush(); say(pick(RETRY) + " " + prompt); }
    };
    grid.append(c);
  });
  st.append(grid);
  say(prompt);
}
async function sayRound(w){
  const st = $("#stage"); st.textContent = "";
  st.append(talk("Agora é sua vez de falar!", "Como se diz " + w.pt + " em inglês?"));
  st.append(el("div","big", w.e), el("div","word", w.en));
  const heard = el("div","heard"); heard.id = "heard"; heard.textContent = srOk ? "Toque no microfone e fale" : "";
  const mic = el("button","mic"); mic.setAttribute("aria-label","Falar");
  mic.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
  const self = el("button","alt","Eu falei! ✅");
  st.append(mic, heard, self);
  let tries = 0, busy = false;
  const success = async () => { busy = true; mic.classList.remove("on"); await win(w); };
  self.onclick = () => { if (!busy) success(); };
  mic.onclick = async () => {
    if (busy) return; hush(); unlockAudio();
    if (!srOk){ heard.textContent = "Fale bem alto e toque em “Eu falei!”"; return; }
    busy = true; mic.classList.add("on"); heard.textContent = "🎧 Ouvindo…";
    const got = await listenOnce(); mic.classList.remove("on");
    if (got === null){ busy = false; heard.textContent = "Fale bem alto e toque em “Eu falei!”"; return; }
    if (matches(got, w.en)) return success();
    tries++; boop();
    if (tries === 1) G.miss++;
    if (tries >= 2){ busy = true; await say("Boa tentativa! Escuta: " + w.en + ". Vamos para a próxima!"); G.r++; nextRound(); return; }
    busy = false; heard.textContent = "Quase! Tenta de novo 💪";
    say("Quase! Escuta: " + w.en + ". Agora você!");
  };
  await say("Como se diz " + w.pt + " em inglês? Fala comigo: " + w.en + "!");
}
async function finish(){
  hush(); progress();
  const stars = G.miss === 0 ? 3 : G.miss <= 2 ? 2 : 1;
  K.stars[G.ph.id] = Math.max(K.stars[G.ph.id] || 0, stars);
  const n = G.i + 1; if (K.unlocked === n && n < PHASES.length) K.unlocked = n + 1;
  save();
  $("#doneTitle").textContent = stars === 3 ? "Perfeito!" : stars === 2 ? "Muito bem!" : "Fase completa!";
  const bs = $("#bigStars"); bs.textContent = ""; for (let i = 0; i < 3; i++) bs.append(el("span", i < stars ? "" : "off", "⭐"));
  const L = $("#learned"); L.textContent = ""; G.words.forEach(w => L.append(el("span", null, w.e + " " + w.en)));
  show("#done"); fanfare(); confetti(160);
  const worldDone = n % 4 === 0;
  await say((stars === 3 ? "Uau! Três estrelas! " : "Parabéns, você completou a fase! ") + (worldDone ? "E ganhou um troféu! Você é demais!" : "Bora para a próxima?"));
}
$("#next").onclick = () => { hush(); show("#home"); renderMap(); };
$("#quit").onclick = () => { hush(); show("#home"); renderMap(); };

/* ---------- start ---------- */
function boot(){
  renderTop(); renderMap();
  if (!K.name){ $("#nameSheet").hidden = false; }
}
$("#nameGo").onclick = () => {
  unlockAudio();
  K.name = $("#kidName").value.trim().slice(0, 20); save();
  $("#nameSheet").hidden = true; renderMap();
  say((K.name ? "Oi, " + K.name + "! " : "Oi! ") + "Eu sou o Solzinho! Vamos aprender inglês brincando? Toque na primeira fase!");
};
$("#kidName").addEventListener("keydown", e => { if (e.key === "Enter") $("#nameGo").click(); });
boot();
})();
</script>
