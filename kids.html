<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FFD21F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Destrava Kids">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="icon" href="/icon-192.png">
<title>Destrava Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: a game — scenic world map with a trail of level nodes and a bottom dock; each level is a run of five mini-games ending in a treasure chest. Bright single look by design. */
:root{
  --sun:#FFD21F; --sun-deep:#E8A400; --ink:#2A2141; --muted:#6E6488; --white:#FFFFFF;
  --good:#2BD467; --good-deep:#17A34A; --pink:#FF5FA2; --pink-deep:#D23C7E; --blue:#3FA2FF; --blue-deep:#1F78D1;
  --violet:#8B5CFF; --violet-deep:#6438D8; --orange:#FF8A3D; --coin:#FFC21A; --lock:#D7D0BE;
  --font:"Fredoka", "Avenir Next Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#FFF3C4;color:var(--ink);font:500 18px/1.3 var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
.gut{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.screen{position:fixed;inset:0;display:flex;flex-direction:column}

/* chunky game button */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-weight:700;border-radius:20px;padding:14px 26px;font-size:22px;color:#fff;background:var(--good);box-shadow:0 6px 0 var(--good-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--good-deep)}
.btn.blue{background:var(--blue);box-shadow:0 6px 0 var(--blue-deep)}
.btn.white{background:#fff;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.14)}
.btn.small{font-size:16px;padding:9px 16px;border-radius:14px}

/* mascot with wearable accessory */
.sunny{position:relative;display:inline-block;flex:none}
.sunny svg{width:100%;height:100%;display:block}
.sunny .wear{position:absolute;left:50%;transform:translateX(-50%);line-height:1;pointer-events:none}
.sunny .wear.top{top:-14%;font-size:48%}
.sunny .wear.eyes{top:33%;font-size:34%}
.sunny .wear.neck{bottom:-6%;font-size:34%}
@keyframes talkb{from{transform:translateY(0) rotate(-3deg)}to{transform:translateY(-6px) rotate(3deg)}}
body.talking .sunny.live{animation:talkb .26s ease-in-out infinite alternate}
@keyframes idle{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* ---------- HUD ---------- */
.hud{flex:none;display:flex;align-items:center;justify-content:space-between;gap:8px;padding-block:calc(env(safe-area-inset-top,0px) + 10px) 10px;position:relative;z-index:5}
.round{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.85);display:grid;place-items:center;font-size:20px;box-shadow:0 4px 0 rgba(0,0,0,.12);text-decoration:none;color:var(--ink);flex:none}
.round svg{width:22px;height:22px}
.chips{display:flex;gap:6px;align-items:center}
.chip{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.92);border-radius:999px;padding:5px 11px 5px 6px;font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;box-shadow:0 4px 0 rgba(0,0,0,.12);flex:none}
.chip .ic{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:16px}
.chip.coins .ic{background:var(--coin)}
.chip.stars .ic{background:#FFE58A}
.chip.fire .ic{background:#FFD3B8}
.chip.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.18)}}

/* ---------- MAP ---------- */
#home{background:#BDE8FF}
.mapwrap{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative}
.world{position:relative;padding:34px 0 40px;overflow:hidden}
.world .banner{position:relative;z-index:3;margin:0 auto 34px;width:max-content;max-width:90%;background:#fff;border-radius:18px;padding:8px 18px;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.world .banner b{display:block;font-size:20px}
.world .banner span{font-size:13px;color:var(--muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.scene{position:absolute;inset:0;pointer-events:none;z-index:0}
.scene .hill{position:absolute;border-radius:50% 50% 0 0;bottom:-40px}
.scene .deco{position:absolute;font-size:34px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.08));animation:sway 3.5s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-5deg)}to{transform:rotate(5deg)}}
.cloud{position:absolute;left:0;width:90px;height:30px;background:#fff;border-radius:30px;opacity:.9;animation:drift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud::before{width:44px;height:44px;left:12px;top:-22px}
.cloud::after{width:34px;height:34px;left:44px;top:-14px}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(calc(100vw + 40px))}}
.trail{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:34px;max-width:420px;margin:0 auto}
.trail svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none;z-index:0}
.node{position:relative;z-index:1;width:88px;height:82px;border-radius:50%;display:grid;place-items:center;font-size:40px;background:var(--c,var(--orange));box-shadow:0 9px 0 rgba(0,0,0,.22), inset 0 -7px 0 rgba(0,0,0,.14), inset 0 6px 0 rgba(255,255,255,.35)}
.node:active{filter:brightness(.95)}
.node.locked{background:var(--lock);filter:grayscale(1);opacity:.85}
.node .lk{position:absolute;right:-6px;bottom:-4px;width:30px;height:30px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.node .st{position:absolute;bottom:-28px;left:50%;transform:translateX(-50%);display:flex;gap:1px;font-size:17px;white-space:nowrap;filter:drop-shadow(0 2px 0 rgba(0,0,0,.15))}
.node .st .off{filter:grayscale(1);opacity:.4}
.node.current::before{content:"";position:absolute;inset:-12px;border-radius:50%;border:6px solid #fff;animation:ring 1.3s ease-in-out infinite}
.node .here{position:absolute;bottom:64px;left:50%;margin-left:-33px;width:66px;height:66px;animation:idle 1.6s ease-in-out infinite}
.node .go{position:absolute;top:50%;left:calc(100% + 12px);transform:translateY(-50%);background:#fff;color:var(--violet);font-size:16px;font-weight:700;padding:5px 12px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.12);white-space:nowrap}
.node.left .go{left:auto;right:calc(100% + 12px)}
.chest{position:relative;z-index:1;font-size:50px;filter:drop-shadow(0 5px 0 rgba(0,0,0,.15))}
.chest.open{animation:idle 1.4s ease-in-out infinite}
@keyframes ring{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.08);opacity:.45}}

/* missions */
.missions{position:relative;z-index:3;margin:0 auto;max-width:420px;width:100%;background:#fff;border-radius:22px;padding:12px 14px;box-shadow:0 6px 0 rgba(0,0,0,.12);display:flex;flex-direction:column;gap:8px;text-align:left}
.missions h3{margin:0;font-size:18px;display:flex;justify-content:space-between;align-items:center}
.mrow{display:grid;grid-template-columns:28px 1fr auto;gap:4px 8px;align-items:center;font-size:16px;font-weight:600;text-align:left}
.mbar{height:10px;border-radius:999px;background:#EFE8D3;overflow:hidden}
.mrow .mbar{grid-column:2/4}
.mbar i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .5s}

/* dock */
.dock{flex:none;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-block:8px calc(env(safe-area-inset-bottom,0px) + 8px);background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -4px 0 rgba(0,0,0,.06);position:relative;z-index:5}
.dock button{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;font-weight:700;color:var(--muted);padding:4px 0;border-radius:16px}
.dock button span{font-size:28px;line-height:1.1;transition:transform .15s}
.dock button[aria-current="page"]{color:var(--ink);background:#FFF3C4}
.dock button[aria-current="page"] span{transform:scale(1.12)}
.dock .dot{position:absolute;top:2px;left:calc(50% + 10px);width:12px;height:12px;border-radius:50%;background:var(--pink);border:2px solid #fff}

/* ---------- PLAY ---------- */
#play{background:radial-gradient(circle at 50% 0%,#FFF8D8 0,#FFE27A 60%,#FFC93C 100%)}
#play.th-bubbles{background:linear-gradient(180deg,#9EE0FF 0%,#4FB6F2 100%)}
#play.th-memory{background:linear-gradient(180deg,#D8C9FF 0%,#A98BFF 100%)}
#play.th-speak{background:radial-gradient(circle at 50% 30%,#FFE3F0 0,#FF9CC8 100%)}
#play.th-rain{background:linear-gradient(180deg,#B8F0C9 0%,#5ED68A 100%)}
.steps{flex:1;display:flex;gap:5px;min-width:0}
.steps i{flex:1;height:14px;border-radius:999px;background:rgba(255,255,255,.55);overflow:hidden;position:relative}
.steps i.done{background:var(--good)}
.steps i.now{background:rgba(255,255,255,.9)}
.steps i.now::after{content:"";position:absolute;inset:0;width:var(--p,0%);background:var(--good);border-radius:999px;transition:width .3s}
.stage{flex:1;min-height:0;position:relative;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:560px;width:100%;margin:0 auto;padding-block:6px calc(env(safe-area-inset-bottom,0px) + 14px)}
.say{display:flex;align-items:center;gap:10px;width:100%;flex:none}
.say .sunny{width:70px;height:70px}
.bubble{position:relative;flex:1;background:#fff;border-radius:20px;padding:10px 14px;font-size:20px;font-weight:700;box-shadow:0 5px 0 rgba(0,0,0,.1)}
.bubble::before{content:"";position:absolute;left:-10px;top:50%;margin-top:-10px;border:10px solid transparent;border-right-color:#fff;border-left:0}
.bubble small{display:block;color:var(--muted);font-size:14px;font-weight:600}
.target{display:inline-flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:4px 16px 4px 8px;font-weight:700;color:var(--violet);font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.1)}
.target .e{font-size:28px}
.listen{display:inline-flex;align-items:center;gap:6px}
.listen svg{width:20px;height:20px}
.title-card{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;width:100%}
.title-card .gi{font-size:96px;animation:pop .6s both}
.title-card h2{margin:0;font-size:38px;color:var(--ink);text-shadow:0 3px 0 rgba(255,255,255,.7)}
.title-card p{margin:0;font-size:19px;color:var(--ink);font-weight:600;opacity:.8}
@keyframes pop{0%{transform:scale(.3)}60%{transform:scale(1.12)}100%{transform:scale(1)}}

/* learn */
.flash{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px}
.flash .card{width:min(72vw,290px);aspect-ratio:.92;max-width:100%;background:#fff;border-radius:34px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;box-shadow:0 10px 0 rgba(0,0,0,.12);animation:flip .5s both}
@keyframes flip{from{transform:rotateY(90deg) scale(.8)}to{transform:none}}
.flash .card .e{font-size:110px;line-height:1}
.flash .card .w{font-size:44px;font-weight:700;color:var(--violet)}
.flash .card .p{font-size:20px;color:var(--muted);font-weight:600}
.dots{display:flex;gap:6px}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.65)}
.dots i.on{background:var(--violet);transform:scale(1.25)}

/* bubbles */
.pond{flex:1;width:100%;position:relative;overflow:hidden;border-radius:26px}
.bub{position:absolute;width:var(--s,104px);height:var(--s,104px);border-radius:50%;display:grid;place-items:center;font-size:calc(var(--s,104px)*.48);
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 9%,rgba(255,255,255,.35) 10% 30%,rgba(255,255,255,.12) 55%,rgba(255,255,255,.28) 100%);
  border:3px solid rgba(255,255,255,.85);box-shadow:inset -6px -8px 18px rgba(63,162,255,.35),0 6px 14px rgba(0,60,120,.15);animation:floatup var(--d,9s) linear infinite;animation-delay:var(--dl,0s)}
.bub > span{display:inline-block;animation:wob 1.6s ease-in-out infinite alternate}
@keyframes floatup{from{transform:translateY(0)}to{transform:translateY(calc(-1 * var(--h,600px) - 140px))}}
@keyframes wob{from{transform:translateX(-4px) rotate(-6deg)}to{transform:translateX(4px) rotate(6deg)}}
.bub.pop{animation-play-state:paused;transition:opacity .25s,filter .25s;opacity:0;filter:blur(2px) brightness(1.5)}
.shake{animation:shake .4s}
@keyframes shake{20%{translate:-8px 0}40%{translate:8px 0}60%{translate:-5px 0}80%{translate:5px 0}}

/* memory */
.mem{flex:1;width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-content:center;max-width:420px}
.mc{aspect-ratio:.8;max-width:100%;perspective:600px}
.mc .in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mc.open .in,.mc.ok .in{transform:rotateY(180deg)}
.mc .f,.mc .b{position:absolute;inset:0;border-radius:20px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;box-shadow:0 6px 0 rgba(0,0,0,.16)}
.mc .f{background:repeating-linear-gradient(45deg,var(--violet) 0 12px,#9C74FF 12px 24px);color:#fff;font-size:40px;font-weight:700}
.mc .b{background:#fff;transform:rotateY(180deg);font-size:54px;text-align:center}
.mc .b.txt{font-size:24px;font-weight:700;color:var(--violet);padding:4px;line-height:1.1}
.mc.ok .b{background:#D9FBE5;box-shadow:0 6px 0 var(--good-deep)}

/* speak */
.magic{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
.magic .e{font-size:104px;line-height:1;animation:idle 1.8s ease-in-out infinite}
.magic .w{font-size:44px;font-weight:700;color:var(--ink);text-shadow:0 3px 0 rgba(255,255,255,.7)}
.power{width:min(80%,320px);height:18px;border-radius:999px;background:rgba(255,255,255,.55);overflow:hidden}
.power i{display:block;height:100%;width:0;background:linear-gradient(90deg,#FFE066,#FF8A3D,#FF5FA2);border-radius:999px;transition:width .25s}
.micbig{width:108px;height:108px;border-radius:50%;background:#fff;color:var(--pink);display:grid;place-items:center;box-shadow:0 8px 0 rgba(0,0,0,.16)}
.micbig svg{width:48px;height:48px}
.micbig.on{background:var(--good);color:#fff;box-shadow:0 8px 0 var(--good-deep);animation:ring 1s infinite}
.heard{min-height:1.4em;color:var(--ink);font-weight:700;text-align:center}

/* rain */
.sky{flex:1;width:100%;position:relative;overflow:hidden;border-radius:26px;background:rgba(255,255,255,.18)}
.drop{position:absolute;top:-90px;width:84px;height:84px;border-radius:24px;background:#fff;display:grid;place-items:center;font-size:48px;box-shadow:0 6px 0 rgba(0,0,0,.14);animation:fall var(--d,5s) linear forwards}
@keyframes fall{to{transform:translateY(calc(var(--h,600px) + 120px)) rotate(var(--r,10deg))}}
.drop.got{animation-play-state:paused;background:#D9FBE5;transition:opacity .25s;opacity:0}
.drop.no{animation-play-state:paused;opacity:.5}
.timer{width:100%;height:12px;border-radius:999px;background:rgba(255,255,255,.5);overflow:hidden;flex:none}
.timer i{display:block;height:100%;width:100%;background:#fff;border-radius:999px;transition:width 1s linear}

/* combo + coin flight */
.combo{position:fixed;left:50%;top:22%;z-index:60;font-size:32px;font-weight:700;color:#fff;background:var(--pink);padding:6px 18px;border-radius:18px;box-shadow:0 6px 0 var(--pink-deep);pointer-events:none;opacity:0;white-space:nowrap}
.combo.show{animation:comboIn .9s forwards}
@keyframes comboIn{0%{opacity:1;transform:translate(-50%,0) scale(0) rotate(-12deg)}30%{opacity:1;transform:translate(-50%,0) scale(1.2) rotate(4deg)}60%{opacity:1;transform:translate(-50%,0) scale(1)}100%{transform:translate(-50%,-30px) scale(1);opacity:0}}
.flycoin{position:fixed;z-index:70;width:30px;height:30px;border-radius:50%;background:var(--coin);display:grid;place-items:center;font-size:16px;box-shadow:0 3px 0 #D59A00;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.6,1)}

/* ---------- END / CHEST ---------- */
#done{background:radial-gradient(circle at 50% 35%,#FFF6CF 0,#FFD84D 50%,#FFB21A 100%);align-items:center;justify-content:center;text-align:center;gap:14px;overflow:hidden}
#done h1{font-size:44px;margin:0;color:var(--ink);text-shadow:0 4px 0 rgba(255,255,255,.7)}
.bigstars{font-size:62px;letter-spacing:4px;height:72px}
.bigstars span{display:inline-block;animation:starIn .5s both}
.bigstars span:nth-child(2){animation-delay:.25s}.bigstars span:nth-child(3){animation-delay:.5s}
.bigstars .off{filter:grayscale(1);opacity:.35}
@keyframes starIn{from{transform:scale(0) rotate(-120deg)}to{transform:none}}
.treasure{font-size:120px;line-height:1;filter:drop-shadow(0 10px 0 rgba(0,0,0,.15))}
.treasure.wiggle{animation:wiggle .5s ease-in-out infinite}
@keyframes wiggle{25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}
.prize{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap}
.prize .stk{width:110px;height:110px;border-radius:26px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:56px;box-shadow:0 7px 0 rgba(0,0,0,.14);animation:pop .6s both;rotate:-6deg}
.prize .stk small{font-size:13px;font-weight:700;color:var(--muted)}
.prize .gain{display:flex;align-items:center;gap:6px;font-size:30px;font-weight:700;background:#fff;border-radius:20px;padding:10px 18px;box-shadow:0 7px 0 rgba(0,0,0,.14);animation:pop .6s .2s both}
.hint{color:var(--ink);font-weight:700;font-size:20px}

/* ---------- sheets ---------- */
.sheet{position:fixed;inset:0;z-index:40;background:rgba(42,33,65,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:#FFF8E2;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:30px 30px 0 0;padding-block:18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.panel h2{margin:0;font-size:28px}
.panel p{margin:0;color:var(--muted)}
.closex{align-self:flex-end}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.stk2{aspect-ratio:1;max-width:100%;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:34px;background:#fff;box-shadow:0 4px 0 rgba(42,33,65,.1);rotate:var(--r,0deg)}
.stk2 small{font-size:11px;font-weight:600;color:var(--muted);line-height:1.1}
.stk2.no{background:#EFEADB;color:#B9B1A0;font-size:28px;box-shadow:none}
.item{background:#fff;border-radius:20px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.1);border:3px solid transparent}
.item .e{font-size:40px;line-height:1.1}
.item b{font-size:15px}
.item .price{display:flex;align-items:center;gap:3px;font-size:15px;font-weight:700;color:#B07C00}
.item.wearing{border-color:var(--good)}
.item.cant{opacity:.55}
.panel input{width:100%;max-width:320px;border:3px solid var(--sun-deep);border-radius:18px;padding:14px;font:600 22px var(--font);text-align:center;color:var(--ink);background:#fff}
.note{font-size:14px;color:var(--muted)}

/* splash */
#splash{position:fixed;inset:0;z-index:45;background:radial-gradient(circle at 50% 38%,#FFF6CF 0,#FFE680 45%,#FFC23C 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;overflow:hidden}
#splash .sunny{animation:talkb .9s ease-in-out infinite alternate}
#splash h1{position:relative;margin:0;font-size:46px;font-weight:700;letter-spacing:-.01em;color:#fff;text-shadow:0 5px 0 rgba(0,0,0,.15)}
#splash h1 span{color:var(--violet)}
#splash p{position:relative;margin:0;color:var(--ink);font-size:20px;font-weight:600}

<script>
(() => {
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));

/* ================= CONTENT ================= */
const WORLDS = [
  { name:"Vale das Primeiras Palavras", tag:"Mundo 1", bg:"linear-gradient(180deg,#BDE8FF 0%,#D9F5C8 70%,#B6E59A 100%)", hills:["#8FD46B","#6FC24E"], deco:["🌳","🌼","🍄","🌷","🦋"], phases:[
    { id:"animals",  title:"Animais",  icon:"🐶", c:"#FF8A3D", words:[["dog","cachorro","🐶"],["cat","gato","🐱"],["fish","peixe","🐟"],["bird","pássaro","🐦"],["horse","cavalo","🐴"]] },
    { id:"colors",   title:"Cores",    icon:"🎨", c:"#FF5FA2", words:[["red","vermelho","🟥"],["blue","azul","🟦"],["yellow","amarelo","🟨"],["green","verde","🟩"],["orange","laranja","🟧"]] },
    { id:"numbers",  title:"Números",  icon:"🔢", c:"#3FA2FF", words:[["one","um","1️⃣"],["two","dois","2️⃣"],["three","três","3️⃣"],["four","quatro","4️⃣"],["five","cinco","5️⃣"]] },
    { id:"fruits",   title:"Frutas",   icon:"🍎", c:"#2BD467", words:[["apple","maçã","🍎"],["banana","banana","🍌"],["grapes","uva","🍇"],["strawberry","morango","🍓"],["orange","laranja","🍊"]] },
  ]},
  { name:"Vila da Minha Casa", tag:"Mundo 2", bg:"linear-gradient(180deg,#FFE3C2 0%,#FFD0A6 60%,#F7B57E 100%)", hills:["#F2A367","#E08A4E"], deco:["🏠","🌻","🪴","🐓","🏡"], phases:[
    { id:"family",   title:"Família",  icon:"👨‍👩‍👧‍👦", c:"#8B5CFF", words:[["mom","mamãe","👩"],["dad","papai","👨"],["baby","bebê","👶"],["brother","irmão","👦"],["sister","irmã","👧"]] },
    { id:"body",     title:"Corpo",    icon:"🖐️", c:"#FF8A3D", words:[["hand","mão","✋"],["eye","olho","👁️"],["nose","nariz","👃"],["mouth","boca","👄"],["foot","pé","🦶"]] },
    { id:"toys",     title:"Brinquedos", icon:"🧸", c:"#FF5FA2", words:[["ball","bola","⚽"],["car","carro","🚗"],["teddy bear","ursinho","🧸"],["kite","pipa","🪁"],["robot","robô","🤖"]] },
    { id:"food",     title:"Comida",   icon:"🍕", c:"#3FA2FF", words:[["pizza","pizza","🍕"],["milk","leite","🥛"],["bread","pão","🍞"],["cake","bolo","🍰"],["water","água","💧"]] },
  ]},
  { name:"Floresta da Aventura", tag:"Mundo 3", bg:"linear-gradient(180deg,#B9F3D8 0%,#7FD8A8 60%,#4DBF86 100%)", hills:["#3DAE73","#2C9460"], deco:["🌲","🦊","🍁","🦉","🌈"], phases:[
    { id:"clothes",  title:"Roupas",   icon:"👕", c:"#2BD467", words:[["shirt","camiseta","👕"],["shoes","sapatos","👟"],["hat","chapéu","🧢"],["dress","vestido","👗"],["socks","meias","🧦"]] },
    { id:"weather",  title:"Tempo",    icon:"🌦️", c:"#8B5CFF", words:[["sun","sol","☀️"],["rain","chuva","🌧️"],["snow","neve","❄️"],["cloud","nuvem","☁️"],["rainbow","arco-íris","🌈"]] },
    { id:"actions",  title:"Ações",    icon:"🏃", c:"#FF8A3D", words:[["run","correr","🏃"],["jump","pular","🦘"],["sleep","dormir","😴"],["eat","comer","😋"],["swim","nadar","🏊"]] },
    { id:"feelings", title:"Sentimentos", icon:"😀", c:"#FF5FA2", words:[["happy","feliz","😀"],["sad","triste","😢"],["angry","bravo","😠"],["scared","com medo","😨"],["tired","cansado","🥱"]] },
  ]},
  { name:"Cidade do Mundo", tag:"Mundo 4", bg:"linear-gradient(180deg,#D7D2FF 0%,#B7AEFF 60%,#9387F2 100%)", hills:["#7C6FE0","#6457C9"], deco:["🏙️","🎡","🚀","🗽","🎈"], phases:[
    { id:"places",   title:"Lugares",  icon:"🏫", c:"#3FA2FF", words:[["school","escola","🏫"],["house","casa","🏠"],["park","parque","🛝"],["beach","praia","🏖️"],["hospital","hospital","🏥"]] },
    { id:"transport",title:"Transportes", icon:"✈️", c:"#2BD467", words:[["plane","avião","✈️"],["bus","ônibus","🚌"],["boat","barco","⛵"],["train","trem","🚆"],["bike","bicicleta","🚲"]] },
    { id:"wild",     title:"Selva",    icon:"🦁", c:"#8B5CFF", words:[["lion","leão","🦁"],["monkey","macaco","🐒"],["elephant","elefante","🐘"],["snake","cobra","🐍"],["tiger","tigre","🐯"]] },
    { id:"phrases",  title:"Frases mágicas", icon:"✨", c:"#FF8A3D", words:[["hello","olá","👋"],["thank you","obrigado","🙏"],["please","por favor","🥺"],["good night","boa noite","🌙"],["I love you","eu te amo","❤️"]] },
  ]},
];
const PHASES = WORLDS.flatMap(w => w.phases);
const SHOP = [
  { id:"cap",    e:"🧢", name:"Boné",    price:15,  pos:"top" },
  { id:"bow",    e:"🎀", name:"Laço",    price:15,  pos:"top" },
  { id:"flower", e:"🌸", name:"Flor",    price:25,  pos:"top" },
  { id:"glasses",e:"🕶️", name:"Óculos",  price:35,  pos:"eyes" },
  { id:"party",  e:"🎉", name:"Festa",   price:40,  pos:"top" },
  { id:"phones", e:"🎧", name:"Fone",    price:50,  pos:"top" },
  { id:"tophat", e:"🎩", name:"Cartola", price:70,  pos:"top" },
  { id:"medal",  e:"🏅", name:"Medalha", price:80,  pos:"neck" },
  { id:"crown",  e:"👑", name:"Coroa",   price:120, pos:"top" },
];
const PRAISE = ["Muito bem!","Uau, mandou bem!","Isso aí!","Que demais!","Perfeito!","Você é fera!","Arrasou!","Show de bola!"];

/* ================= STATE ================= */
const blank = () => ({ name:"", unlocked:1, stars:{}, streak:0, lastDay:null, music:true, coins:0, owned:[], wear:"", daily:null });
let K = blank();
try { const s = localStorage.getItem("destrava_kids"); if (s) K = Object.assign(blank(), JSON.parse(s)); } catch(e){}
const ymd = d => d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
function daily(){ const t = ymd(new Date()); if (!K.daily || K.daily.day !== t) K.daily = { day:t, phases:0, pops:0, speaks:0, claimed:false }; return K.daily; }
const MISSIONS = [ { k:"phases", e:"🗺️", txt:"Complete 2 fases", goal:2 }, { k:"pops", e:"🎯", txt:"Acerte 20 figuras", goal:20 }, { k:"speaks", e:"🎤", txt:"Fale 5 palavras", goal:5 } ];
const missionsDone = () => MISSIONS.every(m => daily()[m.k] >= m.goal);
function save(){ try { localStorage.setItem("destrava_kids", JSON.stringify(K)); } catch(e){} renderHud(); }
function touchDay(){ const t = ymd(new Date()), y = new Date(); y.setDate(y.getDate()-1); if (K.lastDay !== t){ K.streak = K.lastDay === ymd(y) ? K.streak+1 : 1; K.lastDay = t; } daily(); }
const totalStars = () => Object.values(K.stars).reduce((a,b) => a+b, 0);
let shownCoins = null;
function renderHud(){
  $("#coinCount").textContent = $("#coinCount2").textContent = shownCoins ?? K.coins;
  $("#starCount").textContent = totalStars(); $("#streak").textContent = K.streak;
  $("#mDot").hidden = !(missionsDone() && !daily().claimed);
}
function sunny(size, live){
  const w = el("span","sunny" + (live ? " live" : "")); w.style.width = w.style.height = size + "px";
  w.innerHTML = '<svg><use href="#sunsvg"/></svg>';
  const it = SHOP.find(i => i.id === K.wear);
  if (it) w.append(el("span","wear " + it.pos, it.e));
  return w;
}

/* ================= AUDIO ================= */
let actx = null, curSrc = null, cloudOffUntil = 0, seq = 0;
const memCache = new Map();
function unlockAudio(){
  try {
    if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); }
    if (actx.state !== "running") actx.resume();
    const b = actx.createBuffer(1,1,22050), s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0);
  } catch(e){}
}
["pointerdown","touchend","keydown"].forEach(ev => document.addEventListener(ev, unlockAudio, { passive:true }));
const VOICE = "Zephyr";   // natural female voice, the same on every device
async function getVoice(text){
  const url = "/api/tts?s=kids&v=" + VOICE + "&t=" + encodeURIComponent(text);
  if (memCache.has(url)) return memCache.get(url);
  let bytes = null, cache = null;
  try { cache = await caches.open("destrava-kids-voz-v2"); const hit = await cache.match(url); if (hit) bytes = await hit.arrayBuffer(); } catch(e){}
  if (!bytes){
    const r = await fetch(url);
    if (!r.ok){ const d = await r.json().catch(() => ({})); throw { code: d.error || "tts_error", status:r.status }; }
    bytes = await r.arrayBuffer();
    try { cache && await cache.put(url, new Response(bytes.slice(0), { headers:{ "Content-Type":"audio/wav" } })); } catch(e){}
  }
  const buf = await new Promise((ok, bad) => { const p = actx.decodeAudioData(bytes.slice(0), ok, bad); if (p && p.then) p.then(ok, bad); });
  memCache.set(url, buf); if (memCache.size > 200) memCache.delete(memCache.keys().next().value);
  return buf;
}
function playBuf(buf, my){
  return new Promise(async res => {
    if (my !== seq) return res();
    try { if (actx.state !== "running") await actx.resume(); } catch(e){}
    const s = actx.createBufferSource(); s.buffer = buf; s.connect(actx.destination); curSrc = s;
    const guard = setTimeout(end, buf.duration*1000 + 1500);
    function end(){ clearTimeout(guard); if (curSrc === s) curSrc = null; res(); }
    s.onended = end;
    try { s.start(0); } catch(e){ end(); }
  });
}
let voices = [];
const loadVoices = () => { try { voices = speechSynthesis.getVoices() || []; } catch(e){} };
if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function deviceSay(text){
  return new Promise(res => {
    if (!("speechSynthesis" in window)) return res();
    const u = new SpeechSynthesisUtterance(text); u.lang = "pt-BR"; u.rate = .95;
    const sc = v => (/premium|enhanced|aprimorad|melhorad/i.test(v.name) ? 4 : 0) + (/luciana|fernanda|francisca|leila|thalita|raquel|google/i.test(v.name) ? 2 : 0) - (/felipe|daniel|antonio/i.test(v.name) ? 3 : 0);
    const v = voices.filter(v => (v.lang||"").toLowerCase().replace("_","-") === "pt-br").sort((a,b) => sc(b) - sc(a))[0];
    if (v) u.voice = v;
    const g = setTimeout(res, 2500 + text.length*110); u.onend = u.onerror = () => { clearTimeout(g); res(); };
    try { speechSynthesis.speak(u); } catch(e){ res(); }
  });
}
async function say(text){
  if (!text) return;
  const my = seq; unlockAudio();
  const talking = on => { document.body.classList.toggle("talking", on); duck(on); };
  if (actx && Date.now() > cloudOffUntil){
    try { const buf = await getVoice(text); if (my !== seq) return; talking(true); await playBuf(buf, my); if (my === seq) talking(false); return; }
    catch(e){ talking(false); if (my !== seq) return; cloudOffUntil = Date.now() + 3*60*1000; }
  }
  if (my !== seq) return;
  talking(true); await deviceSay(text); talking(false);
}
function hush(){ seq++; try { curSrc && curSrc.stop(); } catch(e){} curSrc = null; try { speechSynthesis.cancel(); } catch(e){} document.body.classList.remove("talking"); duck(false); }
function prefetch(lines){ if (!actx) return; (async () => { for (const t of lines.slice(0, 6)){ try { await getVoice(t); } catch(e){ return; } } })(); }

/* sound effects */
function tone(f, d, at = 0, type = "triangle", v = .18, slide){
  if (!actx) return; const t0 = actx.currentTime + at;
  const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + d);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + .01); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + d + .02);
}
const sfx = {
  pop:   () => { tone(900, .12, 0, "sine", .25, 1800); tone(1400, .08, .03, "sine", .12); },
  coin:  () => { tone(988, .08, 0, "square", .06); tone(1319, .22, .07, "square", .06); },
  ok:    () => { tone(660, .12, 0); tone(880, .12, .09); tone(1320, .25, .18); },
  no:    () => tone(300, .16, 0, "triangle", .16, 220),
  flip:  () => tone(520, .07, 0, "sine", .15, 760),
  whoosh:() => tone(300, .35, 0, "sine", .1, 1200),
  combo: n => [0,1,2].forEach(i => tone(660 * Math.pow(1.26, i + Math.min(n, 6) * .3), .14, i * .07, "square", .05)),
  win:   () => [523,659,784,1047].forEach((f, i) => tone(f, i === 3 ? .5 : .16, i * .15)),
  chest: () => { tone(200, .5, 0, "sawtooth", .05, 600); [784, 988, 1175, 1568].forEach((f, i) => tone(f, .3, .45 + i * .08, "triangle", .12)); },
};

/* background music: an original upbeat, inspiring instrumental loop (C – G – Am – F), kept quiet behind the voice */
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
const CHORDS = [ [48, [60,64,67]], [43, [59,62,67]], [45, [60,64,69]], [41, [60,65,69]] ];   // C, G, Am, F
const HOOK = [ [0,72],[2,76],[3,79],[4,76],[6,74], [8,71],[10,74],[11,79],[12,74],[14,71],
               [16,72],[18,76],[19,81],[20,79],[22,76], [24,77],[26,76],[27,74],[28,72] ];      // original 4-bar hook (16th-step grid in 8ths)
let musicGain = null, musicTimer = null, mStep = 0, mNext = 0, noiseBuf = null;
const STEP = 60 / 118 / 2, MVOL = .05, MDUCK = .014;
function voice(freq, at, dur, type, vol, dest){
  const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(freq, at);
  g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + .008); g.gain.exponentialRampToValueAtTime(.0008, at + dur);
  o.connect(g); g.connect(dest); o.start(at); o.stop(at + dur + .02);
}
function kick(at, dest){ const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(130, at); o.frequency.exponentialRampToValueAtTime(45, at + .12); g.gain.setValueAtTime(.9, at); g.gain.exponentialRampToValueAtTime(.001, at + .16); o.connect(g); g.connect(dest); o.start(at); o.stop(at + .18); }
function hat(at, vol, dest){
  if (!noiseBuf){ noiseBuf = actx.createBuffer(1, actx.sampleRate * .05, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(); s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = 7000;
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(.001, at + .04); s.connect(f); f.connect(g); g.connect(dest); s.start(at);
}
function musicOn(){
  if (!actx || musicTimer) return;
  if (!musicGain){ musicGain = actx.createGain(); musicGain.connect(actx.destination); }
  musicGain.gain.setValueAtTime(document.body.classList.contains("talking") ? MDUCK : MVOL, actx.currentTime);
  mNext = actx.currentTime + .1;
  musicTimer = setInterval(() => {
    while (mNext < actx.currentTime + .5){
      const bar = Math.floor(mStep / 8) % 4, st = mStep % 8, [root, tri] = CHORDS[bar], loop = Math.floor(mStep / 32);
      // bouncy bass
      if ([0, 3, 4, 6].includes(st)) voice(NOTE(root + (st === 6 ? 7 : 0)), mNext, STEP * 1.6, "triangle", .55, musicGain);
      // offbeat chord stabs
      if (st % 2 === 1) tri.forEach(n => voice(NOTE(n), mNext, STEP * .9, "square", .05, musicGain));
      // drums
      if (st === 0 || st === 4) kick(mNext, musicGain);
      hat(mNext, st % 2 ? .12 : .06, musicGain);
      // hook on every other loop, arpeggio sparkle on the others

      lock = true; const [a, b] = open; open = [];
      if (a.cd.w.en === b.cd.w.en){
        await wait(400); a.m.classList.add("ok"); b.m.classList.add("ok"); good(b.m); matched++; setStepProgress(matched / ws.length);
        hush(); await say(wordLine(a.cd.w)); lock = false;
        if (matched === ws.length){ await say(pick(PRAISE)); nextStep(); }
      } else { await wait(700); hush(); await say("Ops! Esse é o " + b.cd.w.en + ". Tente de novo!"); a.m.classList.remove("open"); b.m.classList.remove("open"); G.combo = 0; sfx.no(); lock = false; }
    };
    grid.append(m);
  });
  st.append(grid);
}

/* 4 — SPEAK */
function speak(){
  const st = $("#stage"); const ws = shuffle(G.words).slice(0, 3); let i = 0;
  const round = async () => {
    if (i >= ws.length) return nextStep();
    setStepProgress(i / ws.length);
    st.textContent = ""; const w = ws[i];
    st.append(sayBar("Diga a palavra mágica!", "Como se diz " + w.pt + " em inglês?"));
    const mg = el("div","magic"); mg.append(el("div","e", w.e), el("div","w", w.en));
    const pw = el("div","power"), pi = el("i"); pw.append(pi); mg.append(pw);
    const mic = el("button","micbig"); mic.setAttribute("aria-label","Falar"); mic.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>';
    const heard = el("div","heard", srOk ? "Toque no microfone e fale!" : "Fale bem alto e toque em “Eu falei!”");
    const self = el("button","btn white small","Eu falei! ✅");
    mg.append(mic, heard, self); st.append(mg);
    let tries = 0, busy = false;
    const success = async () => { busy = true; mic.classList.remove("on"); pi.style.width = "100%"; daily().speaks++; good(mic); hush(); await say(pick(PRAISE)); i++; round(); };
    self.onclick = () => { if (!busy) success(); };
    mic.onclick = async () => {
      if (busy) return; hush(); unlockAudio();
      if (!srOk){ heard.textContent = "Fale bem alto e toque em “Eu falei!”"; return; }
      busy = true; mic.classList.add("on"); heard.textContent = "🎧 Ouvindo…"; pi.style.width = "15%";
      let grow = 15; const t = setInterval(() => { grow = Math.min(85, grow + 6); pi.style.width = grow + "%"; }, 250);
      const got = await listenOnce(txt => { heard.textContent = "🎧 " + txt; });
      clearInterval(t); mic.classList.remove("on");
      if (got === null){ busy = false; pi.style.width = "0"; heard.textContent = "Fale bem alto e toque em “Eu falei!”"; return; }
      if (matches(got, w.en)) return success();
      tries++; bad(mic, tries === 1); pi.style.width = "0";
      if (tries >= 2){ busy = true; await say("Boa tentativa! Escuta: " + w.en + ". Vamos para a próxima!"); i++; round(); return; }
      busy = false; heard.textContent = "Quase! Tenta de novo 💪";
      say("Quase! Escuta: " + w.en + ". Agora você!");
    };
    await say("Como se diz " + w.pt + " em inglês? Fala comigo: " + w.en + "!");
  };
  round();
}

/* 5 — RAIN (arcade) */
function rain(){
  const st = $("#stage"); st.textContent = "";
  const tgt = el("div","target");
  const timer = el("div","timer"), ti = el("i"); timer.append(ti);
  const sky = el("div","sky");
  const row = el("div"); row.style.cssText = "display:flex;gap:10px;align-items:center;flex:none"; row.append(el("span", null, "Pegue:"), tgt);
  row.firstChild.style.cssText = "font-weight:700;color:var(--ink);font-size:20px";
  st.append(sayBar("Pegue a figura!", "Toque na figura que a Sunny falar"), row, timer, sky);
  const DUR = 25; let left = DUR, current = null, over = false, firstWrong = true;
  const choose = () => {
    current = pick(G.words.filter(w => !current || w.en !== current.en)); firstWrong = true;
    tgt.textContent = ""; tgt.append(el("span","e", current.e), el("span", null, current.en));
    hush(); say("Pegue o " + current.en + "!");
  };
  const spawn = () => {
    if (over) return;
    const H = sky.clientHeight || 420, W = sky.clientWidth || 340;
    const w = Math.random() < .45 && current ? current : pick(G.words);
    const d = el("button","drop", w.e); d.setAttribute("aria-label", w.pt);
    d.style.cssText = `left:${Math.random() * Math.max(0, W - 84)}px;--h:${H}px;--d:${4.2 + Math.random()*1.6}s;--r:${(Math.random()-.5)*40}deg`;
    d.addEventListener("animationend", e => { if (e.animationName === "fall") d.remove(); });
    d.onclick = () => {
      if (over || d.classList.contains("got")) return;
      if (current && w.en === current.en){ d.classList.add("got"); sfx.pop(); good(d); setTimeout(() => d.remove(), 300); choose(); }
      else { bad(d, firstWrong); firstWrong = false; hush(); const my = seq, want = current; say("Ops! Você tocou no " + w.en + "!").then(() => { if (my === seq && !over && current === want) say("Pegue o " + want.en + "!"); }); }
    };
    sky.append(d);
  };
  choose();
  const spawner = setInterval(spawn, 850); setTimeout(spawn, 100);
  const clock = setInterval(() => { left--; ti.style.width = (left / DUR * 100) + "%"; setStepProgress(1 - left / DUR); if (left <= 0) end(); }, 1000);
  async function end(){
    if (over) return; over = true; clearInterval(spawner); clearInterval(clock);
    sky.querySelectorAll(".drop").forEach(d => d.classList.add("no"));
    hush(); await say("Tempo esgotado! Mandou bem!");
    nextStep();
  }
  G.cleanup = () => { over = true; clearInterval(spawner); clearInterval(clock); };
}

/* ================= FINISH + CHEST ================= */
function finish(){
  hush();
  const stars = G.miss <= 2 ? 3 : G.miss <= 5 ? 2 : 1;
  const first = !(K.stars[G.ph.id] > 0);
  K.stars[G.ph.id] = Math.max(K.stars[G.ph.id] || 0, stars);
  const n = G.i + 1; if (K.unlocked === n && n < PHASES.length) K.unlocked = n + 1;
  const bonus = 10 + (stars === 3 ? 5 : 0);
  daily().phases++; save();
  const D = $("#done"); D.textContent = "";
  D.append(el("h1", null, stars === 3 ? "Perfeito!" : stars === 2 ? "Muito bem!" : "Fase completa!"));
  const bs = el("div","bigstars"); for (let i = 0; i < 3; i++) bs.append(el("span", i < stars ? "" : "off", "⭐")); D.append(bs);
  const ch = el("button","treasure wiggle","🎁"); ch.setAttribute("aria-label","Abrir o baú"); D.append(ch);
  const hint = el("div","hint","Toque no baú para abrir!"); D.append(hint);
  show("#done"); sfx.win(); confetti(140);
  const my = seq;
  say(stars === 3 ? "Uau! Três estrelas!" : "Parabéns, você completou a fase!").then(() => { if (my === seq) say("Toque no baú para abrir!"); });
  ch.onclick = async () => {
    hush(); ch.onclick = null; ch.classList.remove("wiggle"); sfx.chest(); ch.textContent = "✨"; confetti(220);
    await wait(450); ch.remove(); hint.remove();
    const pz = el("div","prize");
    if (first){ const s = el("div","stk"); s.append(el("span", null, G.ph.icon), el("small", null, G.ph.title)); pz.append(s); }
    const gn = el("div","gain", "🪙 +" + (bonus + G.earned)); pz.append(gn);
    D.append(pz); addCoins(bonus, gn);
    const cont = el("button","btn", "Continuar ➜"); cont.style.marginTop = "8px"; D.append(cont);
    cont.onclick = () => { hush(); show("#home"); renderMap(); openTab("map"); sfx.whoosh(); if (missionsDone() && !daily().claimed){ openTab("missions"); } };
    await say(first ? "Você ganhou uma figurinha nova e moedas!" : "Você ganhou mais moedas!");
    if (n % 4 === 0) await say("E ganhou um troféu! Você é demais!");
    else await say("Bora para a próxima?");
  };
}
$("#quit").onclick = () => { hush(); G && G.cleanup && G.cleanup(); show("#home"); renderMap(); openTab("map"); };

/* ================= START ================= */
$("#musicBtn").onclick = () => { unlockAudio(); K.music = !K.music; save(); syncMusicBtn(); K.music ? musicOn() : musicOff(); };
function timeHello(){ const h = new Date().getHours(); return h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite"; }
async function greet(){
  hush(); const my = seq;
  await say(timeHello() + ", " + K.name + "!"); if (my !== seq) return;
  const done = Object.keys(K.stars).length;
  if (missionsDone() && !daily().claimed) await say("Você completou as missões! Abra o baú na aba missões!");
  else await say(K.streak >= 2 ? "Você está mandando muito bem, voltando todo dia! Vamos jogar?" : done ? "Que bom te ver de novo! Vamos continuar a aventura?" : "Que bom te ver! Toque na primeira fase para começar!");
}
function boot(){
  renderHud(); renderMap(); syncMusicBtn();
  $("#splashSunny").replaceWith(Object.assign(sunny(180, false), { id:"splashSunny" }));
  $("#nameSunny").replaceWith(sunny(100, true));
  $("#splashTxt").textContent = K.name ? timeHello() + ", " + K.name + "! Toque para jogar" : "Toque para jogar!";
}
$("#splashGo").onclick = () => {
  unlockAudio(); sfx.whoosh();
  $("#splash").hidden = true;
  if (K.music) musicOn();
  touchDay(); save(); renderMap();
  if (!K.name){ $("#nameSheet").hidden = false; say("Oi! Eu sou a Sunny! Qual é o seu nome?"); }
  else greet();
};
$("#nameGo").onclick = async () => {
  unlockAudio();
  K.name = $("#kidName").value.trim().slice(0, 20); save();
  $("#nameSheet").hidden = true; renderMap();
  hush(); const my = seq;
  if (K.name){ await say("Oi, " + K.name + "!"); if (my !== seq) return; }
  say("Vamos aprender inglês brincando? Toque na primeira fase!");
};
$("#kidName").addEventListener("keydown", e => { if (e.key === "Enter") $("#nameGo").click(); });
let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { if (!$("#home").hidden) renderMap(); }, 200); });
boot();
})();
</script>
