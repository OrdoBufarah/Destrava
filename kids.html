<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FFD21F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Destrava Kids">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="icon" href="/icon-192.png">
<title>Destrava Kids</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one adventure. Home = entrance to a magic world (logo, Super Benjamin big, "Continuar Aventura").
   Adventure = a living world scene; Benjamin talks from a close-up camera window, the lesson objects live in the scene, the mic sits at the bottom.
   Bright single look by design. */
:root{
  --sun:#FFD21F; --sun-2:#FFE15C; --sun-deep:#E3A000; --cream:#FFF8DC; --ink:#22192F; --muted:#6E6488;
  --good:#22C55E; --good-deep:#15803D; --warn:#FF9F1C; --pink:#FF5FA2; --pink-deep:#D23C7E; --blue:#3FA2FF; --blue-deep:#1F78D1;
  --violet:#8B5CFF; --coin:#FFC21A; --sky:#BFE9FF;
  --font:"Fredoka", "Avenir Next Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --camW:min(54vw,300px); --camH:calc(var(--camW) * 4 / 3);
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font:500 18px/1.3 var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
img{max-width:100%}
.gut{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.screen{position:fixed;inset:0;overflow:hidden}

/* logo + buttons */
.logo{display:inline-flex;flex-direction:column;align-items:center;line-height:.86;position:relative}
.logo .rays{position:absolute;top:-.62em;left:50%;transform:translateX(-50%);width:1.3em;height:.6em}
.logo .d{font-weight:700;letter-spacing:-.04em;color:#fff;-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;text-shadow:0 .06em 0 var(--ink)}
.logo .k{font-weight:700;color:var(--sun);-webkit-text-stroke:.09em var(--ink);paint-order:stroke fill;text-shadow:0 .07em 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:700;border-radius:999px;padding:14px 26px;font-size:22px;color:var(--ink);background:var(--sun);box-shadow:0 6px 0 var(--sun-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-deep)}
.btn.white{background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.btn.green{background:var(--good);color:#fff;box-shadow:0 6px 0 var(--good-deep)}
.btn.small{font-size:16px;padding:9px 16px}
.btn svg{width:24px;height:24px}
.round{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.12);flex:none;text-decoration:none;color:var(--ink)}
.round svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.1);font-variant-numeric:tabular-nums}
.chip.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.18)}}

/* ---------------- HOME: the entrance to a magic world ---------------- */
#home{background:linear-gradient(180deg,#8FD3FF 0%,#C9EEFF 40%,#FFF3C2 78%,#FFD84D 100%);display:flex;flex-direction:column}
#home .rays-bg{position:absolute;left:50%;top:46%;width:150vmax;height:150vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.2) 0 8deg,transparent 8deg 16deg);animation:spin 60s linear infinite;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.htop{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding-top:calc(var(--safe-t) + 30px)}
.htop .logo{font-size:44px;margin-left:6px}
.htop .acts{display:flex;gap:8px}
.htop .round .badge{position:absolute;margin:-30px 0 0 30px;width:14px;height:14px;border-radius:50%;background:var(--pink);border:2px solid #fff}
.hstage{position:relative;z-index:2;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.hstage .big{position:relative;width:min(90vw,420px);max-height:100%;object-fit:contain;animation:float 3.4s ease-in-out infinite;filter:drop-shadow(0 18px 18px rgba(120,80,0,.25))}
.hbubble{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:6%;max-width:46%;background:#fff;border-radius:22px;padding:12px 14px;font-weight:700;font-size:18px;line-height:1.2;box-shadow:0 5px 0 rgba(0,0,0,.08);z-index:3;animation:pop .5s .3s both}
.hbubble::after{content:"";position:absolute;right:-12px;top:60%;border:12px solid transparent;border-left-color:#fff;border-right:0}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.hprog{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hprog .where{background:rgba(255,255,255,.9);border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.hcta{position:relative;z-index:2;display:flex;justify-content:center}
.hcta .btn{width:min(100%,420px);font-size:24px;padding:16px 22px;justify-content:space-between}
.hcta .btn .pl{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--sun);display:grid;place-items:center}
.hcta .btn .pl svg{width:22px;height:22px;margin-left:3px}
.tiles{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-top:14px;padding-bottom:calc(var(--safe-b) + 14px)}
.tile{position:relative;background:#FFF6D8;border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:600;box-shadow:0 4px 0 rgba(150,100,0,.18)}
.tile span{font-size:28px;line-height:1.15}
.tile img{width:32px;height:32px;border-radius:50%}
.tile .badge{position:absolute;top:-6px;right:6px;min-width:22px;height:22px;border-radius:999px;background:var(--pink);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* ---------------- ADVENTURE ---------------- */
#adv{background:var(--sky)}
/* WorldScene */
.scene{position:absolute;inset:0;overflow:hidden}
.scene .sun{position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#FFF6C8 0,#FFE27A 35%,rgba(255,226,122,0) 70%)}
.scene .cl{position:absolute;left:0;width:110px;height:34px;background:#fff;border-radius:34px;opacity:.92;animation:drift linear infinite}
.scene .cl::before,.scene .cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
.scene .cl::before{width:52px;height:52px;left:14px;top:-26px}
.scene .cl::after{width:40px;height:40px;left:54px;top:-16px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 60px))}}
.scene .hill{position:absolute;border-radius:50% 50% 0 0}
.scene .deco{position:absolute;line-height:1;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate;filter:drop-shadow(0 4px 0 rgba(0,40,0,.12))}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.scene .river{position:absolute;left:-10%;right:-10%;height:46px;border-radius:50%;background:repeating-linear-gradient(90deg,#5EC8FF 0 30px,#8EDBFF 30px 60px);background-size:120px 100%;animation:flow 3s linear infinite;opacity:.95;transform:rotate(-4deg)}
@keyframes flow{to{background-position:120px 0}}
.scene .bfly{position:absolute;font-size:24px;animation:flutter 9s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:translate(0,0)}25%{transform:translate(40px,-20px)}50%{transform:translate(80px,6px)}75%{transform:translate(30px,18px)}}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:42%;border-radius:60% 60% 0 0/12% 12% 0 0}
.scene .wall{position:absolute;left:0;right:0;top:0;bottom:30%}
.scene .floor{position:absolute;left:0;right:0;bottom:0;height:30%}

/* HUD */
.ahud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding-top:calc(var(--safe-t) + 10px)}
.words{flex:1;display:flex;justify-content:center;gap:6px;min-width:0}
.words i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center;font-style:normal;font-size:18px;border:3px solid rgba(255,255,255,.9)}
.words i.now{background:#fff;border-color:var(--sun);box-shadow:0 0 0 3px rgba(255,210,31,.5)}
.words i.ok{background:var(--good);border-color:#fff}

/* HeroCharacter — close-up camera window */
.cam{position:absolute;z-index:12;left:max(14px,env(safe-area-inset-left,0px));top:calc(var(--safe-t) + 62px);width:var(--camW);height:var(--camH);border-radius:30px;padding:5px;background:linear-gradient(160deg,#FFF3A8,#FFC400 45%,#E09A00);box-shadow:0 10px 0 rgba(120,80,0,.25),0 0 0 4px rgba(255,255,255,.7);transition:width .55s cubic-bezier(.3,1.3,.5,1),height .55s cubic-bezier(.3,1.3,.5,1),top .55s,left .55s,opacity .4s,transform .55s cubic-bezier(.3,1.3,.5,1);transform-origin:20% 20%}
.cam.small{width:92px;height:122px;border-radius:22px}
.cam.off{opacity:0;transform:scale(.4)}
.camin{position:relative;width:100%;height:100%;border-radius:25px;overflow:hidden;background:#F7C948}
.cam.small .camin{border-radius:18px}
.camart{position:absolute;inset:0;transform-origin:50% 60%;will-change:transform}
.camart .pose{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:opacity .28s}
.camart .lid{position:absolute;border-radius:50%;transform:scaleY(0);transform-origin:50% 0;pointer-events:none}
.camart .mouth{position:absolute;overflow:hidden;transform-origin:50% 0;pointer-events:none;border-radius:30% 30% 45% 45%}
.cam .state{position:absolute;right:8px;bottom:8px;background:#fff;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:700;box-shadow:0 3px 0 rgba(0,0,0,.12)}
.cam.small .state{display:none}

/* speech bubble beside the camera */
.sbubble{position:absolute;z-index:13;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));top:calc(var(--safe-t) + 82px + var(--camH));text-align:center;background:#fff;border-radius:22px;padding:10px 12px;box-shadow:0 5px 0 rgba(0,0,0,.1);transition:left .55s,top .55s;animation:pop .35s both}
.sbubble::before{content:"";position:absolute;left:calc(var(--camW) * .45);top:-11px;border:11px solid transparent;border-bottom-color:#fff;border-top:0}
#adv.play .sbubble{text-align:left}
#adv.play .sbubble::before{left:-11px;top:26px;border:11px solid transparent;border-right-color:#fff;border-left:0}
.sbubble b{display:block;font-size:22px;line-height:1.15}
.sbubble b em{font-style:normal;color:#F06A00}
.sbubble small{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-top:2px}
#adv.play .sbubble{left:118px;top:calc(var(--safe-t) + 68px)}

/* the word card (what Benjamin is showing) */
.wcard{position:absolute;z-index:14;right:max(12px,env(safe-area-inset-right,0px));top:calc(var(--safe-t) + 62px + var(--camH) * .12);width:min(38vw,176px);background:#fff;border-radius:24px;padding:10px 8px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 8px 0 rgba(0,0,0,.12);animation:cardIn .55s cubic-bezier(.3,1.4,.5,1) both;rotate:4deg}
@keyframes cardIn{from{transform:translateY(40px) scale(.4) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.wcard .e{font-size:min(20vw,88px);line-height:1.05;animation:float 2.6s ease-in-out infinite}
.wcard .w{display:flex;align-items:center;gap:6px;font-size:30px;font-weight:700}
.wcard .w button{font-size:22px}
.wcard .p{font-size:14px;color:var(--muted);font-weight:600}

/* play field inside the scene */
.field{position:absolute;z-index:11;left:0;right:0;top:calc(var(--safe-t) + 170px + var(--camH));bottom:calc(var(--safe-b) + 150px)}
#adv.play .field{top:calc(var(--safe-t) + 196px);bottom:calc(var(--safe-b) + 20px)}
.spot{position:absolute;width:var(--s,104px);height:var(--s,104px);display:grid;place-items:center;font-size:calc(var(--s,104px) * .68);border-radius:50%;background:radial-gradient(circle at 50% 60%,rgba(255,255,255,.85) 0 52%,rgba(255,255,255,0) 70%);transform:translate(-50%,-50%);animation:peek .6s cubic-bezier(.3,1.5,.5,1) both}
.spot > span{display:inline-block;animation:bob 2.2s ease-in-out infinite alternate}
@keyframes peek{from{transform:translate(-50%,10%) scale(.2);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}
@keyframes bob{from{transform:translateY(-5px)}to{transform:translateY(5px)}}
.spot.right{background:radial-gradient(circle,rgba(34,197,94,.5) 0 55%,rgba(34,197,94,0) 72%);animation:win .5s}
@keyframes win{50%{transform:translate(-50%,-50%) scale(1.25)}}
.spot.gone{transition:opacity .3s,transform .3s;opacity:0;transform:translate(-50%,-80%) scale(.6)}
.shake{animation:shake .45s}
@keyframes shake{20%{translate:-8px 0}40%{translate:8px 0}60%{translate:-5px 0}80%{translate:5px 0}}
.bush{position:absolute;font-size:64px;line-height:1;transform:translate(-50%,-30%);pointer-events:none;filter:drop-shadow(0 4px 0 rgba(0,40,0,.15))}
/* shadows game */
.shadows{position:absolute;left:0;right:0;top:4%;display:flex;justify-content:center;gap:12px}
.shadow{width:min(26vw,104px);aspect-ratio:1;border-radius:24px;background:rgba(255,255,255,.55);border:3px dashed rgba(34,25,47,.25);display:grid;place-items:center;font-size:min(16vw,64px)}
.shadow > span{filter:brightness(0) opacity(.55)}
.shadow.done{border-style:solid;border-color:var(--good);background:rgba(220,252,231,.9)}
.shadow.done > span{filter:none}
.shadow.hot{border-color:var(--sun-deep);background:rgba(255,246,200,.9)}
.pieces{position:absolute;left:0;right:0;bottom:6%;display:flex;justify-content:center;gap:12px}
.piece{width:min(24vw,96px);aspect-ratio:1;border-radius:22px;background:#fff;display:grid;place-items:center;font-size:min(14vw,58px);box-shadow:0 6px 0 rgba(0,0,0,.14);touch-action:none;position:relative;z-index:2}
.piece.drag{z-index:30;box-shadow:0 14px 20px rgba(0,0,0,.2);transition:none}
.piece.sel{outline:4px solid var(--sun-deep)}
.piece.home{transition:transform .3s}

/* VoiceInteraction — microphone bar with clear states */
.micbar{position:absolute;z-index:15;left:0;right:0;bottom:0;padding-bottom:calc(var(--safe-b) + 14px);display:flex;flex-direction:column;align-items:center;gap:6px}
#adv.play .micbar{display:none}
.microw{display:flex;align-items:center;justify-content:center;gap:22px}
.mic{position:relative;width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#FFF0A0,#FFD21F 55%,#F2B100);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(255,255,255,.55),0 8px 0 var(--sun-deep)}
.mic svg{width:46px;height:46px;position:relative;z-index:2}
.mic::before,.mic::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:4px solid transparent}
.mic .bars{position:absolute;inset:0;pointer-events:none}
.mic .bars i{position:absolute;top:50%;width:6px;height:var(--h,14px);margin-top:calc(var(--h,14px) / -2);border-radius:6px;background:var(--sun-deep);opacity:0;transition:height .08s}
.mic[data-s="listening"]{background:radial-gradient(circle at 50% 35%,#C9F7D8,#5EE08F 55%,#22C55E);color:#fff;box-shadow:0 0 0 8px rgba(34,197,94,.25),0 8px 0 var(--good-deep)}
.mic[data-s="listening"]::before{border-color:rgba(34,197,94,.55);animation:ripple 1.4s ease-out infinite}
.mic[data-s="listening"]::after{border-color:rgba(34,197,94,.35);animation:ripple 1.4s .7s ease-out infinite}
.mic[data-s="listening"] .bars i{opacity:1;background:var(--good)}
@keyframes ripple{from{transform:scale(1);opacity:1}to{transform:scale(1.6);opacity:0}}
.mic[data-s="processing"]{background:radial-gradient(circle,#E7DEFF,#B59CFF);color:var(--violet)}
.mic[data-s="processing"]::before{border-color:var(--violet) transparent transparent transparent;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.mic[data-s="ok"]{background:radial-gradient(circle,#D7FBE3,#22C55E);color:#fff;animation:win2 .5s}
@keyframes win2{50%{transform:scale(1.15)}}
.mic[data-s="unclear"]{background:radial-gradient(circle,#FFE8C7,#FFB547);color:var(--ink)}
.mic[data-s="help"]{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.mic[data-s="speaking"]{filter:saturate(.6) opacity(.75)}
.mic[data-s="off"]{filter:grayscale(1) opacity(.5)}
.side{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.miccap{min-height:1.3em;font-size:16px;font-weight:700;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.8);text-align:center;padding:0 12px}
.said{margin-top:2px}

/* FlyingHero — the full-body Benjamin for adventures and celebrations */
#flyer{position:fixed;left:0;top:0;width:var(--fs,120px);z-index:40;pointer-events:none;will-change:transform;filter:drop-shadow(0 10px 12px rgba(80,50,0,.25))}
#flyer img{width:100%;display:block}
#flyer .wear{position:absolute;line-height:1}
#flyer .wear.crown{left:50%;top:-14%;font-size:calc(var(--fs,120px)*.3)}
#flyer .wear.glasses{left:54%;top:22%;font-size:calc(var(--fs,120px)*.2)}
#flyer .carry{position:absolute;left:62%;top:-30%;font-size:calc(var(--fs,120px)*.7);filter:drop-shadow(0 0 18px #FFE680)}
.trailbit{position:fixed;z-index:39;pointer-events:none;font-size:18px;animation:trailfade 1.3s ease-out forwards}
@keyframes trailfade{from{opacity:.85;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-50%) translateY(14px) scale(.4)}}

/* CelebrationSystem */
.goldsky{position:fixed;inset:0;z-index:38;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 30%,rgba(255,240,160,.95),rgba(255,200,40,.85) 60%,rgba(255,170,0,.8))}
.goldsky.on{animation:goldsky 2.6s ease-in-out forwards}
@keyframes goldsky{0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
.goldsky i{position:absolute;width:180px;height:60px;border-radius:60px;background:#FFF6CF;box-shadow:0 0 30px #FFF3B0;animation:rush 1.1s linear infinite}
@keyframes rush{from{transform:translateY(110vh)}to{transform:translateY(-30vh)}}
.yeah{position:fixed;left:50%;top:calc(var(--safe-t) + 18%);z-index:45;transform:translate(-50%,0);font-size:44px;font-weight:700;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);pointer-events:none;opacity:0;white-space:nowrap}
.yeah.show{animation:yeah 1.3s forwards}
@keyframes yeah{0%{opacity:0;transform:translate(-50%,20px) scale(.3) rotate(-10deg)}25%{opacity:1;transform:translate(-50%,0) scale(1.15) rotate(3deg)}70%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-30px)}}
.flashok{position:fixed;inset:0;z-index:36;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,0) 40%,rgba(34,197,94,.35));opacity:0}
.flashok.go{animation:fl .5s}
@keyframes fl{30%{opacity:1}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.flycoin{position:fixed;z-index:60;width:30px;height:30px;border-radius:50%;background:var(--coin);display:grid;place-items:center;font-size:16px;box-shadow:0 3px 0 #D59A00;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.6,1)}

/* overlays: level complete, intro card, farewell */
.over{position:fixed;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding-left:16px;padding-right:16px;background:radial-gradient(circle at 50% 30%,rgba(255,246,200,.96),rgba(255,214,77,.96) 60%,rgba(255,178,26,.97))}
.over h1{margin:0;font-size:46px;line-height:1;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);rotate:-4deg}
.over h2{margin:0;font-size:22px}
.over p{margin:0;font-size:17px;color:var(--muted);font-weight:600}
.learned{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;background:#fff;border-radius:22px;padding:12px;box-shadow:0 6px 0 rgba(0,0,0,.1);max-width:420px}
.learned .lw{display:flex;flex-direction:column;align-items:center;font-size:40px;line-height:1.1;position:relative;min-width:58px}
.learned .lw b{font-size:15px}
.learned .lw i{position:absolute;right:-2px;top:-4px;font-style:normal;font-size:16px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#fff}
.learned .lw i.half{background:var(--warn)}
.bigstar{font-size:110px;line-height:1;animation:pop .6s both;filter:drop-shadow(0 0 30px #FFF3A0)}
.stars3{font-size:52px;letter-spacing:4px}
.stars3 span{display:inline-block;animation:pop .5s both}
.stars3 span:nth-child(2){animation-delay:.2s}.stars3 span:nth-child(3){animation-delay:.4s}
.stars3 .off{filter:grayscale(1);opacity:.35}
.introcard{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:28px;padding:18px 22px;box-shadow:0 8px 0 rgba(0,0,0,.12);animation:pop .5s both}
.introcard .tag{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.introcard .ic{font-size:64px;line-height:1}
.introcard b{font-size:28px}
.cloudseat{font-size:120px;line-height:.8;filter:drop-shadow(0 6px 0 rgba(0,0,0,.08))}
.row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* sheets */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(34,25,47,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--cream);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:30px 30px 0 0;padding-block:18px calc(22px + var(--safe-b));display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.panel h2{margin:0;font-size:27px}
.panel p{margin:0;color:var(--muted)}
.closex{align-self:flex-end}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 rgba(120,90,0,.08);width:100%;text-align:left}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.stk{aspect-ratio:1;max-width:100%;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;background:#fff;box-shadow:0 4px 0 rgba(42,33,65,.1);rotate:var(--r,0deg);position:relative}
.stk small{font-size:11px;font-weight:700;color:var(--muted);line-height:1.1}
.stk.no{background:#EFEADB;color:#B9B1A0;font-size:24px;box-shadow:none}
.stk.half::after{content:"";position:absolute;right:6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.medal{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:38px;opacity:.35;filter:grayscale(1)}
.medal.got{opacity:1;filter:none}
.medal small{font-size:12px;font-weight:700;color:var(--ink)}
.lvl{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #F1E9D2;font-size:15px;font-weight:600}
.lvl:first-of-type{border-top:0}
.lvl .ic{font-size:28px;text-align:center}
.lvl.lock{opacity:.45}
.item{background:#fff;border-radius:20px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.1);border:3px solid transparent}
.item .e{font-size:36px;line-height:1.1}
.item b{font-size:13.5px;line-height:1.1}
.item .price{font-size:15px;font-weight:700;color:#B07C00}
.item.on{border-color:var(--good)}
.item.cant{opacity:.55}
.panel input{width:100%;max-width:320px;border:3px solid var(--sun-deep);border-radius:18px;padding:14px;font:600 22px var(--font);text-align:center;color:var(--ink);background:#fff}
.ages{display:flex;flex-direction:column;gap:10px;width:100%;max-width:400px}
.age{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;text-align:left;background:#fff;border-radius:20px;padding:10px 12px;box-shadow:0 5px 0 rgba(0,0,0,.1);border:3px solid transparent}
.age .e{font-size:40px;text-align:center}
.age b{display:block;font-size:18px}
.age span{font-size:14px;color:var(--muted)}
.age.on{border-color:var(--good)}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opt{background:#fff;border-radius:14px;padding:9px 14px;font-weight:700;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.1);border:3px solid transparent}
.opt.on{border-color:var(--good)}
.note{font-size:14px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:28px 1fr auto;gap:4px 8px;align-items:center;font-size:15px;font-weight:600}
.mbar{height:10px;border-radius:999px;background:#EFE8D3;overflow:hidden;grid-column:2/4}
.mbar i{display:block;height:100%;background:var(--good);border-radius:999px}
.gate{font-size:30px;font-weight:700}
@media (max-width:370px){.htop .logo{font-size:36px}.tile{font-size:11px}.wcard .w{font-size:24px}.sbubble b{font-size:18px}}

<script>
(() => {
"use strict";
const $ = s => document.querySelector(s);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const shuffle = a => { a = a.slice(); for (let i = a.length-1; i > 0; i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];
const wait = ms => new Promise(r => setTimeout(r, ms));
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

/* =====================================================================
   CONTENT — one progressive journey, world by world (existing content reorganized)
   ===================================================================== */
const WORLDS = [
  { id:"forest", name:"Floresta Encantada", icon:"🌳", scene:"forest", levels:[
    { id:"meet",    title:"Conhecendo o Benjamin", icon:"👋", goal:"Cumprimentar e fazer amizade", words:[["hello","olá","👋"],["friend","amigo","🤗"],["yes","sim","👍"],["bye","tchau","🙋"]] },
    { id:"first",   title:"Primeiras palavras",   icon:"🙏", goal:"Palavras gentis e sentimentos", words:[["thank you","obrigado","🙏"],["please","por favor","🥺"],["happy","feliz","😀"],["sad","triste","😢"]] },

  ]},
  { id:"house", name:"Casa Mágica", icon:"🏠", scene:"house", levels:[
    { id:"home",    title:"Objetos da casa", icon:"🛏️", goal:"As coisas da casa", words:[["bed","cama","🛏️"],["chair","cadeira","🪑"],["door","porta","🚪"],["lamp","luminária","💡"],["book","livro","📖"]] },

    { id:"body",    title:"Corpo",    icon:"✋", goal:"As partes do corpo", words:[["hand","mão","✋"],["eye","olho","👁️"],["nose","nariz","👃"],["mouth","boca","👄"],["foot","pé","🦶"]] },
    { id:"toys",    title:"Brinquedos", icon:"🧸", goal:"Hora de brincar", words:[["ball","bola","⚽"],["car","carro","🚗"],["teddy bear","ursinho","🧸"],["kite","pipa","🪁"],["robot","robô","🤖"]] },
    { id:"numbers", title:"Números",  icon:"🔢", goal:"Contar até cinco", words:[["one","um","1️⃣"],["two","dois","2️⃣"],["three","três","3️⃣"],["four","quatro","4️⃣"],["five","cinco","5️⃣"]] },
  ]},
  { id:"city", name:"Cidade Alegre", icon:"🏙️", scene:"city", levels:[
    { id:"food",    title:"Comidas",  icon:"🍕", goal:"No restaurante", words:[["pizza","pizza","🍕"],["milk","leite","🥛"],["bread","pão","🍞"],["cake","bolo","🍰"],["water","água","💧"]] },

    { id:"actions", title:"Ações",    icon:"🏃", goal:"O que eu faço", words:[["run","correr","🏃"],["jump","pular","🦘"],["sleep","dormir","😴"],["eat","comer","😋"],["swim","nadar","🏊"]] },
  ]},

    { id:"transport", title:"Transportes", icon:"✈️", goal:"Como a gente viaja", words:[["plane","avião","✈️"],["bus","ônibus","🚌"],["boat","barco","⛵"],["train","trem","🚆"],["bike","bicicleta","🚲"]] },
    { id:"weather", title:"Tempo",    icon:"🌦️", goal:"Como está o dia", words:[["sun","sol","☀️"],["rain","chuva","🌧️"],["snow","neve","❄️"],["cloud","nuvem","☁️"],["rainbow","arco-íris","🌈"]] },
    { id:"wild",    title:"Selva",    icon:"🦁", goal:"Os animais da selva", words:[["lion","leão","🦁"],["monkey","macaco","🐒"],["elephant","elefante","🐘"],["snake","cobra","🐍"],["tiger","tigre","🐯"]] },
    { id:"phrases", title:"Pequenas frases", icon:"✨", goal:"Frases do dia a dia", words:[["good morning","bom dia","🌅"],["good night","boa noite","🌙"],["I love you","eu te amo","❤️"],["let's go","vamos lá","🚀"],["I'm hungry","estou com fome","😋"]] },
    { id:"talk",    title:"Conversas simples", icon:"💬", goal:"Bater um papo em inglês", words:[["how are you","como você está","🙂"],["I'm fine","estou bem","👍"],["what's your name","qual é o seu nome","🤔"],["my name is","meu nome é","😊"],["nice to meet you","prazer em te conhecer","🤝"]] },
  ]},
];
const LEVELS = WORLDS.flatMap((w, wi) => w.levels.map(l => Object.assign({ world:wi }, l)));

const AGES = {
  mini: { e:"🧸", label:"3 a 4 anos", name:"Pequeno Herói", txt:"Ouvir, tocar e repetir. Sem leitura e sem pressa.", words:3, choices:2, shadows:false, tol:.5,  tries:2, style:"heromini", minutes:12, goals:{levels:1,taps:6,speaks:3} },
  kid:  { e:"🚀", label:"5 a 6 anos", name:"Explorador",   txt:"Brincadeiras com figuras e falar em inglês.",   words:4, choices:3, shadows:true,  tol:.4,  tries:2, style:"hero",     minutes:15, goals:{levels:2,taps:12,speaks:5} },
  big:  { e:"🏆", label:"7 anos ou mais", name:"Aventureiro", txt:"Todas as atividades, com a palavra escrita.", words:5, choices:4, shadows:true,  tol:.34, tries:2, style:"hero",     minutes:20, goals:{levels:2,taps:16,speaks:6} },
};
const SHOP = [
  { id:"stars",   e:"⭐", name:"Rastro de estrelas", price:10,  kind:"trail" },
  { id:"hearts",  e:"💖", name:"Rastro de corações", price:20,  kind:"trail" },
  { id:"bubbles", e:"🫧", name:"Rastro de bolhas",   price:25,  kind:"trail" },
  { id:"rainbow", e:"🌈", name:"Rastro de arco-íris",price:35,  kind:"trail" },
  { id:"bolt",    e:"⚡", name:"Rastro de raios",    price:60,  kind:"trail" },
  { id:"glasses", e:"🕶️", name:"Óculos de herói",    price:50,  kind:"wear" },
  { id:"crown",   e:"👑", name:"Coroa de campeão",   price:120, kind:"wear" },
];
const LINES = {
  yeah:  ["Yeahhh! Você conseguiu!","Uhuul! Perfeito!","Isso! Mandou muito bem!","Uau! Que inglês lindo!"],
  yeahMini: ["Yeahhh! Muito bem, meu amigo!","Uau! Você conseguiu! Que orgulho!","Isso mesmo! Que lindo!"],
  tap:   ["Isso!","Muito bem!","Achou!","Boa!"],
};

/* =====================================================================
   ProgressManager — everything saved on this device only (minimal data)
   ===================================================================== */
const Progress = (() => {
  const blank = () => ({ v:4, name:"", age:"", pos:{ level:0, word:0 }, done:{}, words:{}, coins:0, owned:[], trail:"", wear:"", music:true, voice:"natural", minutes:0, streak:0, lastDay:null, daily:null, medals:[], seenAlbum:0 });
  let K = blank();
  try {
    const s = JSON.parse(localStorage.getItem("destrava_kids") || "null");
    if (s){
      if (s.v === 4) K = Object.assign(blank(), s);
      else { // migrate the previous version: keep the child's name, age, coins and powers
        ["name","age","coins","owned","trail","wear","music","streak","lastDay"].forEach(k => { if (s[k] != null) K[k] = s[k]; });
        if (!AGES[K.age]) K.age = "";
        if (K.wear && !SHOP.some(i => i.id === K.wear)) K.wear = "";
        if (K.trail && !SHOP.some(i => i.id === K.trail)) K.trail = "";
      }
    }
  } catch(e){}
  const ymd = d => d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  const api = {
    get K(){ return K; },
    save(){ try { localStorage.setItem("destrava_kids", JSON.stringify(K)); } catch(e){} renderHud(); },
    reset(){ try { localStorage.removeItem("destrava_kids"); } catch(e){} try { caches.delete("destrava-kids-voz-v4"); } catch(e){} K = blank(); },
    daily(){ const t = ymd(new Date()); if (!K.daily || K.daily.day !== t) K.daily = { day:t, levels:0, taps:0, speaks:0, claimed:false }; return K.daily; },
    touchDay(){ const t = ymd(new Date()), y = new Date(); y.setDate(y.getDate()-1); if (K.lastDay !== t){ K.streak = K.lastDay === ymd(y) ? K.streak+1 : 1; K.lastDay = t; } api.daily(); },
    stars(){ return Object.values(K.done).reduce((a,b) => a+b, 0); },
    medal(id){ if (!K.medals.includes(id)){ K.medals.push(id); return true; } return false; },
  };
  return api;
})();
const K = () => Progress.K;
const A = () => AGES[K().age] || AGES.kid;
const levelWords = L => L.words.slice(0, A().words).map(([en, pt, e]) => ({ en, pt, e }));

/* =====================================================================
   LearningEngine — participation ≠ attempt ≠ approximate ≠ consolidated
   ===================================================================== */
const Learning = (() => {
  const norm = s => String(s).toLowerCase().replace(/[’']/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
  function lev(a, b){ const m = a.length, n = b.length, d = Array.from({length:m+1}, (_,i) => [i, ...Array(n).fill(0)]); for (let j = 1; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return d[m][n]; }
  const rec = en => (K().words[en] ||= { seen:0, part:0, tries:0, approx:0, exact:0, tapOk:0, tapBad:0 });
  return {
    /* what the child said: "exact" | "approx" | "attempt" (spoke, not close) | "silence" (heard nothing — never an error) */
    evaluate(alts, target){
      const t = norm(target), xs = (alts || []).map(norm).filter(Boolean);
      if (!xs.length) return "silence";
      if (xs.some(x => (" "+x+" ").includes(" "+t+" "))) return "exact";
      const tol = A().tol, lim = Math.max(1, Math.round(t.length * tol));
      const close = xs.some(x => [x, ...x.split(" ")].some(w => lev(w, t) <= lim) || (t.includes(" ") && lev(x, t) <= lim + 1));
      return close ? "approx" : "attempt";
    },
    seen(en){ rec(en).seen++; },

   ===================================================================== */
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const Voice = (() => {
  let srOk = !!SR, rec = null, barsT = null;
  const mic = $("#mic"), cap = $("#micCap"), bars = $("#bars");
  for (let i = 0; i < 8; i++){ const b = el("i"); const a = (i / 8) * Math.PI * 2; b.style.left = `calc(50% + ${Math.cos(a) * 62}px - 3px)`; b.style.top = `calc(50% + ${Math.sin(a) * 62}px)`; bars.append(b); }
  function setState(s, caption){
    mic.dataset.s = s; if (caption != null) cap.textContent = caption;
    clearInterval(barsT);
    if (s === "listening") barsT = setInterval(() => [...bars.children].forEach(b => b.style.setProperty("--h", (8 + Math.random() * 22) + "px")), 120);
  }
  return {
    get available(){ return srOk; },
    setState,
    /* resolves { kind: "heard", alts } | { kind: "silence" } | { kind: "unavailable" } */
    listen(maxMs = 7000){
      return new Promise(res => {
        if (!srOk) return res({ kind:"unavailable" });
        let got = [], done = false, heardAny = false;
        const finish = v => { if (done) return; done = true; clearTimeout(dog); clearTimeout(quiet); rec = null; res(v); };
        const dog = setTimeout(() => { try { r.abort(); } catch(e){} finish(got.length ? { kind:"heard", alts:got } : { kind:"silence" }); }, maxMs);

          r.onresult = ev => {
            heardAny = true; got = [];
            for (const x of ev.results) for (let i = 0; i < x.length; i++) got.push(x[i].transcript);
            cap.textContent = "🎧 " + (got[0] || "");
            // the child is talking: wait for a short pause before deciding (never cut them off)
            clearTimeout(quiet); quiet = setTimeout(() => { try { r.stop(); } catch(e){} }, 1400);
          };
          r.onerror = ev => { if (/not-allowed|service-not-allowed|audio-capture/.test(ev.error)){ srOk = false; finish({ kind:"unavailable" }); } };
          r.onend = () => finish(got.length ? { kind:"heard", alts:got } : { kind:"silence" });
          r.start(); sfx.listen();
        } catch(e){ srOk = false; finish({ kind:"unavailable" }); }
      });
    },
    stop(){ try { rec && rec.abort(); } catch(e){} rec = null; },
  };
})();

    o.append(el("h2", null, "Adorei brincar com você!"));
    o.append(el("p", null, "Que tal descansar um pouquinho? Amanhã tem mais aventura."));
    const row = el("div","row2"); const bye = el("button","btn","Até amanhã 👋"), more = el("button","btn white small","Mais um nível");
    row.append(bye, more); o.append(row);
    Hero.hideCam(); Hero.flyer.show(150); Hero.flyer.place(innerWidth / 2, innerHeight * .2); Hero.flyer.to(innerWidth / 2, innerHeight * .22); Hero.flyer.wave(true);
    bye.onclick = () => { hush(); Hero.flyer.wave(false); o.hidden = true; Hero.flyer.hide(); K().minutes = 0; Progress.save(); goHome(); };
    more.onclick = () => { hush(); Hero.flyer.wave(false); o.hidden = true; Hero.flyer.hide(); K().minutes = 0; Progress.save(); start(K().pos.level); };
    await say("Adorei brincar e aprender com você! Que tal descansar um pouquinho? Amanhã tem mais aventura!");
  }

  /* entering the adventure */
  async function start(idx, resumeAt = 0){
    hush(); Voice.stop();
    const L = LEVELS[idx], W = WORLDS[L.world];
    const words = levelWords(L);
    run = { idx, i: Math.min(resumeAt, words.length - 1), words, allWords: L.words.map(([en, pt, e]) => ({ en, pt, e })), token: Math.random(), waitingMic:null };
    if (run.allWords.length < A().choices) run.allWords = LEVELS.slice(0, 3).flatMap(levelWords);
    K().pos = { level: idx, word: run.i }; Progress.touchDay(); Progress.save();
    $("#home").hidden = true; $("#adv").hidden = false; $("#over").hidden = true; $("#saidBtn").hidden = true;
    Scene.render(L.world); renderDots(); field.textContent = ""; card.hidden = true; bubble.hidden = true; Hero.hideCam();
    musicOn(); Voice.setState("speaking", "");
    prefetch(["Nível " + (idx + 1) + ": " + L.title + "!", teachLine(words[run.i]), yourTurn(words[run.i])]);
    // entrance: the world appears, Benjamin flies in and opens his camera
    const o = $("#over"); o.textContent = ""; o.hidden = false; o.style.background = "transparent";
    const ic = el("div","introcard"); ic.append(el("span","tag", W.name), el("span","ic", L.icon), el("b", null, "Nível " + (idx + 1) + ": " + L.title), el("span","tag", L.goal)); o.append(ic);
    Hero.flyer.show(140); Hero.flyer.place(innerWidth + 120, innerHeight * .7); sfx.whoosh();
    const my = run.token;
    Hero.flyer.to(innerWidth * .5, innerHeight * .2, "dash").then(() => Hero.flyer.flip());
    const firstVisit = !Object.keys(K().done).some(id => LEVELS.find(l => l.id === id)?.world === L.world);
    if (firstVisit) await say("Bem-vindo à " + W.name + "!");
    if (my !== run.token) return;
    await say("Nível " + (idx + 1) + ": " + L.title + "! Vamos nessa?");
    if (my !== run.token) return;
    const c = $("#cam").getBoundingClientRect();
    await Hero.flyer.to(c.left + c.width * .5, c.top + c.height * .5, "dash");
    Hero.flyer.hide(); o.hidden = true; o.style.background = "";
    if (my !== run.token) return;
    teachWord(words[run.i]);
  }

  /* side buttons */
  $("#repeatBtn").onclick = () => { if (!run) return; const w = run.reviewWord && !card.hidden ? run.reviewWord : run.words[run.i]; if (!w) return; hush(); Voice.stop(); Emotion.set("teaching"); say(teachLine(w)).then(() => { if (Emotion.now === "teaching") Emotion.set("listening"); }); };
  $("#helpBtn").onclick = async () => { if (!run) return; const w = run.words[run.i]; if (!w) return; hush(); Voice.stop(); Emotion.set("help"); await say("Escuta bem devagar: " + w.en + "! " + w.en + "! Agora toque no microfone e fala comigo!"); Voice.setState("help", "Toque no microfone 🎤"); run.waitingMic = run.waitingMic || (async () => { run.waitingMic = null; Voice.setState("listening", "Estou ouvindo…"); Emotion.set("listening"); const my = run.token; const r = await Voice.listen(); if (my === run.token) handleResult(w, r, 0); }); };
  $("#mic").onclick = () => {
    if (!run) return;
    if (run.waitingMic){ hush(); run.waitingMic(); return; }
    if ($("#mic").dataset.s === "listening") return;
    if (!Voice.available) { Voice.setState("off", "Fale bem alto e toque em “Eu falei!”"); $("#saidBtn").hidden = false; }
  };
  $("#advBack").onclick = () => { stop(); goHome(); };
  function stop(){ if (run) run.token = Math.random(); hush(); Voice.stop(); Hero.flyer.hide(); $("#over").hidden = true; }
  return { start, stop, get running(){ return !!run; }, farewell };
})();
const P = () => Progress.daily();

/* session time (only counted while a level is open), for healthy pauses */
setInterval(() => { if (!$("#adv").hidden && document.visibilityState === "visible"){ K().minutes += .5; Progress.save(); } }, 30000);

/* =====================================================================
   HOME
   ===================================================================== */
function renderHome(){
  const k = K(), L = LEVELS[k.pos.level] || LEVELS[0], W = WORLDS[L.world];
  $("#homeWhere").textContent = W.icon + " " + W.name + " · Nível " + (k.pos.level + 1) + ": " + L.title;
  $("#homeStars").textContent = Progress.stars();
  $("#continueTxt").textContent = Object.keys(k.done).length || k.pos.word ? "Continuar Aventura" : "Começar Aventura";
  $("#homeBubble").textContent = k.name ? "Oi, " + k.name + "! Vamos aprender inglês hoje?" : "Oi, amigo! Vamos aprender inglês hoje?";
  const g = Progress.daily(); $("#giftDot").hidden = g.claimed;
  const n = Object.keys(k.words).filter(e => Learning.level(e) >= 4).length - (k.seenAlbum || 0);
  $("#albumBadge").hidden = n <= 0; $("#albumBadge").textContent = n;
}
function goHome(){ Adv.stop(); $("#adv").hidden = true; $("#home").hidden = false; renderHome(); }
let greeted = false;
async function greet(){
  if (greeted) return; greeted = true; hush();
  const k = K(); if (!k.name) return;
  const h = new Date().getHours(), hello = h < 12 ? "Bom dia" : h < 18 ? "Boa tarde" : "Boa noite";
  musicOn(); await say(hello + ", " + k.name + "!"); await say("Vamos aprender inglês hoje?");
}
$("#homeHero").onclick = () => { greeted = false; greet(); };
$("#continueBtn").onclick = () => {
  unlockAudio(); musicOn();
  if (!K().name) return onboarding();
  if (!K().age) return askAge(() => Adv.start(K().pos.level, K().pos.word));
  if (K().minutes >= A().minutes){ K().minutes = 0; Progress.save(); }
  Adv.start(K().pos.level, K().pos.word);
};

/* =====================================================================
   SHEETS: onboarding, conquistas, figurinhas, perfil, presente, pais
   ===================================================================== */
function openSheet(build, closable = true){
  const p = $("#sheetPanel"); p.textContent = "";
  if (closable){ const c = el("button","btn white small closex","Fechar"); c.onclick = closeSheet; p.append(c); }
  build(p); $("#sheet").hidden = false; p.scrollTop = 0;
}
function closeSheet(){ hush(); $("#sheet").hidden = true; renderHome(); }
$("#sheet").addEventListener("click", e => { if (e.target.id === "sheet" && K().name && K().age) closeSheet(); });
const face = s => { const i = el("img"); i.src = "/hero-face.png"; i.alt = ""; i.style.cssText = `width:${s}px;height:${s}px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.1)`; return i; };

function onboarding(){
  openSheet(p => {
    p.append(face(96), el("h2", null, "Qual é o seu nome?"));
    const inp = el("input"); inp.maxLength = 20; inp.autocomplete = "off"; inp.placeholder = "Seu nome"; inp.id = "kidName"; p.append(inp);
    const ok = el("button","btn green","Próximo"); p.append(ok);
    p.append(el("p","note","Só o primeiro nome. Fica salvo apenas neste aparelho."));
    const next = async () => { K().name = inp.value.trim().slice(0, 20); Progress.save(); hush(); if (K().name) await say("Oi, " + K().name + "!"); askAge(() => Adv.start(0)); };
    ok.onclick = next; inp.addEventListener("keydown", e => { if (e.key === "Enter") next(); });
  }, false);
  say("Oi! Eu sou o Super Benjamin! Qual é o seu nome?");
}
function ageButtons(p, after){
  const box = el("div","ages");
  Object.entries(AGES).forEach(([k, a]) => {
    const b = el("button","age" + (K().age === k ? " on" : "")); const t = el("div"); t.append(el("b", null, a.label + " · " + a.name), el("span", null, a.txt));
    b.append(el("span","e", a.e), t); b.onclick = () => { K().age = k; Progress.save(); sfx.ok(); after(); }; box.append(b);
  });
  p.append(box);
}
function askAge(then){
  openSheet(p => {
    p.append(face(96), el("h2", null, "Quantos anos você tem?"), el("p", null, "Assim o Super Benjamin prepara as aventuras certinhas para você."));
    ageButtons(p, async () => { $("#sheet").hidden = true; hush(); await say(K().age === "mini" ? "Que legal! Vamos aprender juntinhos!" : "Que legal! Vamos nessa aventura!"); then && then(); });
  }, false);
  say("Quantos anos você tem?");
}
const MEDALS = [
  { id:"first-level", e:"🥉", t:"Primeiro nível" },
  { id:"world-forest", e:"🌳", t:"Floresta completa" },
  { id:"world-house", e:"🏠", t:"Casa completa" },
  { id:"world-city", e:"🏙️", t:"Cidade completa" },
  { id:"world-travel", e:"✈️", t:"Volta ao mundo" },
  { id:"ten-words", e:"🏅", t:"10 palavras" },
  { id:"streak-3", e:"🔥", t:"3 dias seguidos" },
  { id:"daily", e:"🎁", t:"Baú do dia" },
];
function openTrophies(){
  openSheet(p => {
    p.append(el("h2", null, "⭐ Minhas conquistas"));
    p.append(el("p", null, Progress.stars() + " estrelas · " + K().coins + " moedas"));
    const mg = el("div","grid4"); MEDALS.forEach(m => { const d = el("div","medal" + (K().medals.includes(m.id) ? " got" : "")); d.append(m.e, el("small", null, m.t)); mg.append(d); }); p.append(mg);
    WORLDS.forEach((w, wi) => {
      const c = el("div","card"); c.append(el("b", null, w.icon + " " + w.name));
      w.levels.forEach(l => {
        const idx = LEVELS.findIndex(x => x.id === l.id), st = K().done[l.id] || 0, locked = idx > K().pos.level && !st;
        const r = el("div","lvl" + (locked ? " lock" : "")); r.append(el("span","ic", locked ? "🔒" : l.icon), el("span", null, (idx + 1) + ". " + l.title), el("span", null, "⭐".repeat(st) || (idx === K().pos.level ? "▶" : "")));
        c.append(r);
      });
      p.append(c);
    });
  });
  say("Olha só as suas conquistas!");
}
function openAlbum(){
  K().seenAlbum = Object.keys(K().words).filter(e => Learning.level(e) >= 4).length; Progress.save();
  openSheet(p => {
    p.append(el("h2", null, "🃏 Minhas figurinhas"));
    p.append(el("p", null, "Cada palavra que você aprende vira uma figurinha!"));
    WORLDS.forEach(w => {
      const c = el("div","card"); c.append(el("b", null, w.icon + " " + w.name));
      const g = el("div","grid4"); g.style.marginTop = "8px";
      w.levels.flatMap(levelWords).forEach((x, i) => { const lv = Learning.level(x.en); const d = el("div","stk" + (lv >= 4 ? "" : lv >= 1 ? " half" : " no"), lv >= 1 ? x.e : "?"); d.style.setProperty("--r", ((i*37)%7 - 3) + "deg"); if (lv >= 1) d.append(el("small", null, x.en)); g.append(d); });
      c.append(g); p.append(c);
    });
    p.append(el("p","note","Figurinha com bolinha laranja: quase lá! Ela volta na revisão para ficar completa."));
  });
  say("Suas figurinhas! Cada palavra que você aprende vira uma figurinha!");
}
function openProfile(){
  openSheet(p => {
    p.append(face(96), el("h2", null, K().name || "Meu perfil"));
    p.append(el("p", null, AGES[K().age] ? AGES[K().age].e + " " + AGES[K().age].name : ""));
    p.append(el("b", null, "⚡ Poderes do Benjamin"));
    p.append(el("span","chip", "🪙 " + K().coins + " moedas"));
    const g = el("div","grid3");
    SHOP.forEach(it => {
      const owned = K().owned.includes(it.id), key = it.kind === "trail" ? "trail" : "wear", on = K()[key] === it.id;
      const b = el("button","item" + (on ? " on" : "") + (!owned && K().coins < it.price ? " cant" : ""));
      b.append(el("span","e", it.e), el("b", null, it.name), el("span","price", on ? "Usando ✓" : owned ? "Usar" : "🪙 " + it.price));
      b.onclick = () => {
        if (on){ K()[key] = ""; Progress.save(); Hero.wearChanged(); openProfile(); return; }
        if (!owned && K().coins < it.price){ sfx.soft(); b.classList.remove("shake"); void b.offsetWidth; b.classList.add("shake"); hush(); say("Faltam moedas! Vamos jogar mais um pouquinho?"); return; }
        if (!owned){ K().coins -= it.price; K().owned.push(it.id); sfx.star(); burst(innerWidth/2, innerHeight/2, 60); } else sfx.ok();
        K()[key] = it.id; Progress.save(); Hero.wearChanged(); openProfile(); hush(); say("Uhuul! Ficou demais!");
      };
      g.append(b);
    });
    p.append(g);
  });
}
function openGift(){
  openSheet(p => {
    const d = Progress.daily(), G = A().goals;
    const ms = [ { k:"levels", e:"🗺️", t:G.levels > 1 ? "Complete " + G.levels + " níveis" : "Complete 1 nível", g:G.levels }, { k:"taps", e:"👆", t:"Encontre " + G.taps + " figuras", g:G.taps }, { k:"speaks", e:"🎤", t:"Fale " + G.speaks + " palavras", g:G.speaks } ];
    const all = ms.every(m => d[m.k] >= m.g);
    p.append(el("h2", null, "🎁 Surpresa do dia"));
    p.append(el("p", null, "Brinque hoje e abra o baú. Amanhã tem outro! Sem pressa."));
    const c = el("div","card"); c.style.display = "flex"; c.style.flexDirection = "column"; c.style.gap = "12px";
    ms.forEach(m => { const r = el("div","mrow"), v = Math.min(d[m.k], m.g); r.append(el("span", null, m.e), el("span", null, m.t), el("span", null, (v >= m.g ? "✅ " : "") + v + "/" + m.g)); const bar = el("div","mbar"), i = el("i"); i.style.width = (v/m.g*100) + "%"; bar.append(i); r.append(bar); c.append(r); });
    p.append(c);
    const t = el("div","bigstar", d.claimed ? "🏆" : "🎁"); p.append(t);
    if (!d.claimed && all){ const b = el("button","btn green","Abrir baú!"); b.onclick = () => { d.claimed = true; Progress.medal("daily"); sfx.star(); burst(innerWidth/2, innerHeight/2, 120); addCoins(40, b); t.textContent = "🏆"; b.remove(); hush(); say("Uau! Você ganhou quarenta moedas!"); }; p.append(b); }
  });
}
/* parents' area: behind a simple adult check */
function openParents(){
  const a = 6 + Math.floor(Math.random() * 4), b = 5 + Math.floor(Math.random() * 4), ans = a + b;
  const opts = shuffle([ans, ans + 1 + Math.floor(Math.random()*3), ans - 1 - Math.floor(Math.random()*3)]);
  openSheet(p => {
    p.append(el("h2", null, "Área dos pais"), el("p", null, "Para continuar, resolva a conta:"), el("div","gate", a + " + " + b + " = ?"));
    const row = el("div","opts"); opts.forEach(o => { const x = el("button","opt", String(o)); x.onclick = () => o === ans ? parentsPanel() : closeSheet(); row.append(x); }); p.append(row);
  });
}
function parentsPanel(){
  openSheet(p => {
    p.append(el("h2", null, "Área dos pais"));
    const c1 = el("div","card"); c1.append(el("b", null, "Nome da criança"));
    const inp = el("input"); inp.value = K().name; inp.maxLength = 20; inp.onchange = () => { K().name = inp.value.trim().slice(0, 20); Progress.save(); }; c1.append(inp); p.append(c1);
    const c2 = el("div","card"); c2.append(el("b", null, "Idade")); ageButtons(c2, () => parentsPanel()); p.append(c2);
    const c3 = el("div","card"); c3.append(el("b", null, "Tempo de cada sessão"), el("p","note","Depois desse tempo o Benjamin sugere uma pausa, sem pressionar."));
    const o3 = el("div","opts"); [["Automático (pela idade)", 0],["10 min",10],["15 min",15],["20 min",20],["30 min",30]].forEach(([t, v]) => { const x = el("button","opt" + ((K().limit || 0) === v ? " on" : ""), t); x.onclick = () => { K().limit = v; AGES[K().age || "kid"].minutes = v || ({mini:12,kid:15,big:20})[K().age || "kid"]; Progress.save(); parentsPanel(); }; o3.append(x); }); c3.append(o3); p.append(c3);
    const c4 = el("div","card"); c4.append(el("b", null, "Som"));
    const o4 = el("div","opts");
    const mb = el("button","opt" + (K().music ? " on" : ""), "🎵 Música " + (K().music ? "ligada" : "desligada")); mb.onclick = () => { K().music = !K().music; Progress.save(); K().music ? musicOn() : musicOff(); parentsPanel(); };
    const vb = el("button","opt" + (K().voice !== "device" ? " on" : ""), K().voice !== "device" ? "🗣️ Voz natural" : "📱 Voz do aparelho"); vb.onclick = () => { K().voice = K().voice === "device" ? "natural" : "device"; Progress.save(); parentsPanel(); };
    o4.append(mb, vb); c4.append(o4); p.append(c4);
    const c5 = el("div","card"); c5.append(el("b", null, "Privacidade"));
    c5.append(el("p","note","O progresso fica salvo só neste aparelho. Não há anúncios, conta ou cadastro. O Destrava não grava a voz da criança: o microfone usa o reconhecimento de fala do próprio navegador (Google ou Apple), e só o texto reconhecido é comparado com a palavra. As falas do Benjamin são frases fixas geradas pelo servidor de voz. Não existe conversa livre com IA no modo Kids."));
    let armed = false; const del = el("button","btn white small","🗑️ Apagar todos os dados"); del.onclick = () => { if (!armed){ armed = true; del.textContent = "Toque de novo para confirmar"; return; } Progress.reset(); closeSheet(); renderHome(); };
    c5.append(del); p.append(c5);
  });
}
$("#tProfile").onclick = () => { sfx.flip(); openProfile(); };
$("#tTrophies").onclick = () => { sfx.flip(); openTrophies(); };
$("#tAlbum").onclick = () => { sfx.flip(); openAlbum(); };
$("#tParents").onclick = $("#gearBtn").onclick = () => { sfx.flip(); openParents(); };
$("#giftBtn").onclick = () => { sfx.flip(); openGift(); };

/* boot */
if (K().limit) AGES[K().age || "kid"].minutes = K().limit;
if (K().streak >= 3) Progress.medal("streak-3");
renderHud(); renderHome();
document.addEventListener("pointerdown", () => { if (!$("#home").hidden && $("#sheet").hidden) greet(); }, { once:true });
})();
