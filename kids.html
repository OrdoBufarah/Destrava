<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#FFD21F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Destrava Kids">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="icon" href="/icon-192.png">
<title>Destrava Kids</title>
<script src="/art.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: one adventure. Home = entrance to a magic world (logo, Super Benjamin big, "Continuar Aventura").
   Adventure = a living world scene; Benjamin talks from a close-up camera window, the lesson objects live in the scene, the mic sits at the bottom.
   Bright single look by design. */
:root{
  --sun:#FFD21F; --sun-2:#FFE15C; --sun-deep:#E3A000; --cream:#FFF8DC; --ink:#22192F; --muted:#6E6488;
  --good:#22C55E; --good-deep:#15803D; --warn:#FF9F1C; --pink:#FF5FA2; --pink-deep:#D23C7E; --blue:#3FA2FF; --blue-deep:#1F78D1;
  --violet:#8B5CFF; --coin:#FFC21A; --sky:#BFE9FF;
  --font:"Fredoka", "Avenir Next Rounded", "Arial Rounded MT Bold", system-ui, sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --camW:min(46vw,250px); --camH:calc(var(--camW) * .92);
  color-scheme:light;
}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--sky);color:var(--ink);font:500 18px/1.3 var(--font);overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:4px solid var(--violet);outline-offset:3px}
img{max-width:100%}
.gut{padding-left:max(14px,env(safe-area-inset-left,0px));padding-right:max(14px,env(safe-area-inset-right,0px))}
.screen{position:fixed;inset:0;overflow:hidden}

/* logo + buttons */
.logo{display:inline-flex;flex-direction:column;align-items:center;line-height:.86;position:relative}
.logo .rays{position:absolute;top:-.62em;left:50%;transform:translateX(-50%);width:1.3em;height:.6em}
.logo .d{font-weight:700;letter-spacing:-.04em;color:#fff;-webkit-text-stroke:.07em var(--ink);paint-order:stroke fill;text-shadow:0 .06em 0 var(--ink)}
.logo .k{font-weight:700;color:var(--sun);-webkit-text-stroke:.09em var(--ink);paint-order:stroke fill;text-shadow:0 .07em 0 var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:700;border-radius:999px;padding:14px 26px;font-size:22px;color:var(--ink);background:var(--sun);box-shadow:0 6px 0 var(--sun-deep);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-deep)}
.btn.white{background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.14)}
.btn.green{background:var(--good);color:#fff;box-shadow:0 6px 0 var(--good-deep)}
.btn.small{font-size:16px;padding:9px 16px}
.btn svg{width:24px;height:24px}
.round{width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;font-size:22px;box-shadow:0 4px 0 rgba(0,0,0,.12);flex:none;text-decoration:none;color:var(--ink)}
.round svg{width:22px;height:22px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border-radius:999px;padding:6px 12px;font-weight:700;font-size:17px;box-shadow:0 4px 0 rgba(0,0,0,.1);font-variant-numeric:tabular-nums}
.chip.bump{animation:bump .35s}
@keyframes bump{50%{transform:scale(1.18)}}

/* ---------------- HOME: the entrance to a magic world ---------------- */
#home{background:linear-gradient(180deg,#8FD3FF 0%,#C9EEFF 40%,#FFF3C2 78%,#FFD84D 100%);display:flex;flex-direction:column}
#home .rays-bg{position:absolute;left:50%;top:46%;width:150vmax;height:150vmax;transform:translate(-50%,-50%);background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.2) 0 8deg,transparent 8deg 16deg);animation:spin 60s linear infinite;pointer-events:none}
@keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
.htop{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start;padding-top:calc(var(--safe-t) + 30px)}
.htop .logo{font-size:44px;margin-left:6px}
.htop .acts{display:flex;gap:8px}
.htop .round .badge{position:absolute;margin:-30px 0 0 30px;width:14px;height:14px;border-radius:50%;background:var(--pink);border:2px solid #fff}
.hstage{position:relative;z-index:2;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
.hstage .big{position:relative;width:min(90vw,420px);max-height:100%;object-fit:contain;animation:float 3.4s ease-in-out infinite;filter:drop-shadow(0 18px 18px rgba(120,80,0,.25))}
.hbubble{position:absolute;left:max(14px,env(safe-area-inset-left,0px));top:6%;max-width:46%;background:#fff;border-radius:22px;padding:12px 14px;font-weight:700;font-size:18px;line-height:1.2;box-shadow:0 5px 0 rgba(0,0,0,.08);z-index:3;animation:pop .5s .3s both}
.hbubble::after{content:"";position:absolute;right:-12px;top:60%;border:12px solid transparent;border-left-color:#fff;border-right:0}
@keyframes float{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-12px) rotate(2deg)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
.hprog{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.hprog .where{background:rgba(255,255,255,.9);border-radius:999px;padding:6px 14px;font-weight:600;font-size:15px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.hcta{position:relative;z-index:2;display:flex;justify-content:center}
.hcta .btn{width:min(100%,420px);font-size:24px;padding:16px 22px;justify-content:space-between}
.hcta .btn .pl{width:44px;height:44px;border-radius:50%;background:var(--ink);color:var(--sun);display:grid;place-items:center}
.hcta .btn .pl svg{width:22px;height:22px;margin-left:3px}
.tiles{position:relative;z-index:2;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;padding-top:14px;padding-bottom:calc(var(--safe-b) + 14px)}
.tile{position:relative;background:#FFF6D8;border-radius:18px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:12.5px;font-weight:600;box-shadow:0 4px 0 rgba(150,100,0,.18)}
.tile span{font-size:28px;line-height:1.15}
.tile img{width:32px;height:32px;border-radius:50%}
.tile .badge{position:absolute;top:-6px;right:6px;min-width:22px;height:22px;border-radius:999px;background:var(--pink);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 5px}

/* ---------------- ADVENTURE ---------------- */
#adv{background:var(--sky)}
/* WorldScene */
.scene{position:absolute;inset:0;overflow:hidden}
.scene .sun{position:absolute;right:-60px;top:-60px;width:240px;height:240px;border-radius:50%;background:radial-gradient(circle,#FFF6C8 0,#FFE27A 35%,rgba(255,226,122,0) 70%)}
.scene .cl{position:absolute;left:0;width:110px;height:34px;background:#fff;border-radius:34px;opacity:.92;animation:drift linear infinite}
.scene .cl::before,.scene .cl::after{content:"";position:absolute;background:#fff;border-radius:50%}
.scene .cl::before{width:52px;height:52px;left:14px;top:-26px}
.scene .cl::after{width:40px;height:40px;left:54px;top:-16px}
@keyframes drift{from{transform:translateX(-160px)}to{transform:translateX(calc(100vw + 60px))}}
.scene .hill{position:absolute;border-radius:50% 50% 0 0}
.scene .deco{position:absolute;line-height:1;transform-origin:50% 100%;animation:sway 4s ease-in-out infinite alternate;filter:drop-shadow(0 4px 0 rgba(0,40,0,.12))}
@keyframes sway{from{transform:rotate(-3deg)}to{transform:rotate(3deg)}}
.scene .river{position:absolute;left:-10%;right:-10%;height:46px;border-radius:50%;background:repeating-linear-gradient(90deg,#5EC8FF 0 30px,#8EDBFF 30px 60px);background-size:120px 100%;animation:flow 3s linear infinite;opacity:.95;transform:rotate(-4deg)}
@keyframes flow{to{background-position:120px 0}}
.scene .bfly{position:absolute;font-size:24px;animation:flutter 9s ease-in-out infinite}
@keyframes flutter{0%,100%{transform:translate(0,0)}25%{transform:translate(40px,-20px)}50%{transform:translate(80px,6px)}75%{transform:translate(30px,18px)}}
.scene .ground{position:absolute;left:0;right:0;bottom:0;height:42%;border-radius:60% 60% 0 0/12% 12% 0 0}
.scene .wall{position:absolute;left:0;right:0;top:0;bottom:30%}
.scene .floor{position:absolute;left:0;right:0;bottom:0;height:30%}

/* HUD */
.ahud{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding-top:calc(var(--safe-t) + 10px)}
.words{flex:1;display:flex;justify-content:center;gap:6px;min-width:0}
.words i{width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.6);display:grid;place-items:center;font-style:normal;font-size:18px;font-weight:700;color:#fff;border:3px solid rgba(255,255,255,.9);padding:3px;--es:20px}
.words i.now{background:#fff;border-color:var(--sun);box-shadow:0 0 0 3px rgba(255,210,31,.5)}
.words i.ok{background:var(--good);border-color:#fff}
.cam{display:none}

/* illustrations (art.js) */
.art{width:100%;height:100%;display:block;overflow:visible}
.art-emoji{display:grid;place-items:center;font-size:var(--es,64px);line-height:1}

/* subtitle: one short line at the top */
.sbubble{position:absolute;z-index:13;left:max(14px,env(safe-area-inset-left,0px));right:max(14px,env(safe-area-inset-right,0px));top:calc(var(--safe-t) + 62px);text-align:center;background:rgba(255,255,255,.95);border-radius:22px;padding:8px 12px;box-shadow:0 5px 0 rgba(0,0,0,.1);animation:pop .35s both}
.sbubble b{display:flex;align-items:center;justify-content:center;gap:8px;font-size:24px;line-height:1.15}
.sbubble .subart{width:44px;height:44px;flex:none;--es:34px}
.sbubble small{display:block;font-size:14px;color:var(--muted);font-weight:600}
.sbubble small:empty{display:none}

/* the stage: where each word is discovered */
.stage{position:absolute;z-index:11;left:0;right:0;top:calc(var(--safe-t) + 128px);bottom:calc(var(--safe-b) + 176px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;pointer-events:none}
.stage > *{pointer-events:auto}
.mystery{width:min(56vw,240px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.98) 0 7%,rgba(255,255,255,.45) 8% 30%,rgba(140,210,255,.5) 58%,rgba(90,160,255,.75) 88%,rgba(255,170,220,.8) 100%);box-shadow:inset 0 0 0 5px rgba(255,255,255,.9),inset -14px -18px 30px rgba(255,120,200,.25),0 12px 30px rgba(40,110,200,.3);animation:mfloat 2.6s ease-in-out infinite}
.mystery .q{font-size:110px;font-weight:700;line-height:1;color:#FFD21F;-webkit-text-stroke:4px #3B2A20;text-shadow:0 5px 0 #3B2A20;paint-order:stroke fill;animation:qpulse 1.3s ease-in-out infinite}
.mystery.hint{box-shadow:inset 0 0 0 4px rgba(255,255,255,.85),0 0 0 0 rgba(255,210,31,.8);animation:mfloat 2.6s ease-in-out infinite,glow 1.1s ease-out infinite}
@keyframes mfloat{0%,100%{translate:0 0}50%{translate:0 -14px}}
@keyframes qpulse{50%{scale:1.12}}
@keyframes glow{from{box-shadow:inset 0 0 0 4px rgba(255,255,255,.85),0 0 0 0 rgba(255,210,31,.9)}to{box-shadow:inset 0 0 0 4px rgba(255,255,255,.85),0 0 0 36px rgba(255,210,31,0)}}
.bigart{width:min(66vw,290px);aspect-ratio:1;animation:reveal .6s cubic-bezier(.3,1.6,.5,1) both;filter:drop-shadow(0 6px 0 rgba(0,0,0,.08));--es:min(44vw,190px)}
.bigart > .art{animation:idle 2.8s ease-in-out infinite}
.bigart.wiggle{animation:wiggle .6s}
@keyframes reveal{from{scale:.2;rotate:-20deg;opacity:0}to{scale:1;rotate:0deg;opacity:1}}
@keyframes wiggle{20%{rotate:-8deg;scale:1.06}50%{rotate:7deg;scale:1.1}80%{rotate:-4deg}}
@keyframes idle{50%{translate:0 -6px;scale:1.02}}
.wlabel{display:flex;flex-direction:column;align-items:center;background:#fff;border-radius:20px;padding:4px 20px 6px;box-shadow:0 5px 0 rgba(0,0,0,.1);animation:pop .4s .25s both}
.wlabel b{font-size:36px;line-height:1.05;letter-spacing:.02em}
.wlabel small{font-size:15px;color:var(--muted);font-weight:600}

/* play field (rising bubbles, shadows) */
.field{position:absolute;z-index:11;left:0;right:0;top:calc(var(--safe-t) + 124px);bottom:0;overflow:hidden;pointer-events:none}
.field > *{pointer-events:auto}
.field .shadows,.field .pieces{pointer-events:none}.field .shadow,.field .piece{pointer-events:auto}
.bub{position:absolute;left:var(--x);bottom:calc(-1 * var(--s));width:var(--s);height:var(--s);margin-left:calc(var(--s) / -2);border-radius:50%;padding:calc(var(--s) * .16);background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 7%,rgba(255,255,255,.3) 8% 34%,rgba(170,225,255,.3) 62%,rgba(110,185,255,.6) 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.9),0 6px 16px rgba(40,110,200,.18);animation:rise var(--d,7s) linear forwards;touch-action:none}
.bub.balloon{background:none;box-shadow:none;padding:0;width:calc(var(--s) * 1.1);height:calc(var(--s) * 1.25)}
.bub .in{display:block;width:100%;height:100%;pointer-events:none;--es:calc(var(--s) * .5)}
.bub .in.nope{animation:nope .45s}
@keyframes rise{0%{transform:translate(0,0)}25%{transform:translate(16px,-30vh)}50%{transform:translate(-16px,-60vh)}75%{transform:translate(12px,-90vh)}100%{transform:translate(0,-120vh)}}
@keyframes bpop{to{scale:1.6;opacity:0}}
@keyframes nope{20%{rotate:-14deg}50%{rotate:12deg}80%{rotate:-6deg}}
.shake{animation:shake .45s}
@keyframes shake{20%{translate:-8px 0}40%{translate:8px 0}60%{translate:-5px 0}80%{translate:5px 0}}
.shadows{position:absolute;left:0;right:0;top:12%;display:flex;justify-content:center;gap:12px}
.shadow{width:min(27vw,112px);aspect-ratio:1;border-radius:26px;background:rgba(255,255,255,.55);border:3px dashed rgba(34,25,47,.25);display:grid;place-items:center;padding:10px;--es:min(16vw,64px)}
.shadow .art{filter:brightness(0) opacity(.45)}
.shadow.done{border-style:solid;border-color:var(--good);background:rgba(220,252,231,.9)}
.shadow.done .art{filter:none}
.shadow.hot{border-color:var(--sun-deep);background:rgba(255,246,200,.9)}
.pieces{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 40px);display:flex;justify-content:center;gap:12px}
.piece{width:min(26vw,108px);aspect-ratio:1;border-radius:24px;background:#fff;display:grid;place-items:center;padding:10px;box-shadow:0 6px 0 rgba(0,0,0,.14);touch-action:none;position:relative;z-index:2;--es:min(14vw,58px)}
.piece .art{pointer-events:none}
.piece.drag{z-index:30;box-shadow:0 14px 20px rgba(0,0,0,.2);transition:none}
.piece.sel{outline:4px solid var(--sun-deep)}
.piece.home{transition:transform .3s}

/* VoiceInteraction — microphone bar with clear states */
.micbar{position:absolute;z-index:15;left:0;right:0;bottom:0;padding-bottom:calc(var(--safe-b) + 14px);display:flex;flex-direction:column;align-items:center;gap:6px}
.microw{display:flex;align-items:center;justify-content:center;gap:22px}
.mic{position:relative;width:104px;height:104px;border-radius:50%;background:radial-gradient(circle at 50% 35%,#FFF0A0,#FFD21F 55%,#F2B100);color:var(--ink);display:grid;place-items:center;box-shadow:0 0 0 8px rgba(255,255,255,.55),0 8px 0 var(--sun-deep)}
.mic svg{width:46px;height:46px;position:relative;z-index:2}
.mic::before,.mic::after{content:"";position:absolute;inset:-8px;border-radius:50%;border:4px solid transparent}
.mic .bars{position:absolute;inset:0;pointer-events:none}
.mic .bars i{position:absolute;top:50%;width:6px;height:var(--h,14px);margin-top:calc(var(--h,14px) / -2);border-radius:6px;background:var(--sun-deep);opacity:0;transition:height .08s}
.mic[data-s="listening"]{background:radial-gradient(circle at 50% 35%,#C9F7D8,#5EE08F 55%,#22C55E);color:#fff;box-shadow:0 0 0 8px rgba(34,197,94,.25),0 8px 0 var(--good-deep)}
.mic[data-s="listening"]::before{border-color:rgba(34,197,94,.55);animation:ripple 1.4s ease-out infinite}
.mic[data-s="listening"]::after{border-color:rgba(34,197,94,.35);animation:ripple 1.4s .7s ease-out infinite}
.mic[data-s="listening"] .bars i{opacity:1;background:var(--good)}
@keyframes ripple{from{transform:scale(1);opacity:1}to{transform:scale(1.6);opacity:0}}
.mic[data-s="processing"]{background:radial-gradient(circle,#E7DEFF,#B59CFF);color:var(--violet)}
.mic[data-s="processing"]::before{border-color:var(--violet) transparent transparent transparent;animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.mic[data-s="ok"]{background:radial-gradient(circle,#D7FBE3,#22C55E);color:#fff;animation:win2 .5s}
@keyframes win2{50%{transform:scale(1.15)}}
.mic[data-s="unclear"]{background:radial-gradient(circle,#FFE8C7,#FFB547);color:var(--ink)}
.mic[data-s="help"]{animation:nudge 1.2s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:scale(1)}50%{transform:scale(1.09)}}
.mic[data-s="speaking"]{filter:saturate(.6) opacity(.75)}
.mic[data-s="off"]{filter:grayscale(1) opacity(.5)}
.side{width:52px;height:52px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.12)}
.miccap{min-height:1.3em;font-size:16px;font-weight:700;color:var(--ink);text-shadow:0 1px 0 rgba(255,255,255,.8);text-align:center;padding:0 12px}
.said{margin-top:2px}

/* FlyingHero — the full-body Benjamin for adventures and celebrations */
#flyer{position:fixed;left:0;top:0;width:120px;z-index:40;pointer-events:none;will-change:transform;filter:drop-shadow(0 10px 12px rgba(80,50,0,.25))}
#flyer img{width:100%;display:block}
#flyer .wear{position:absolute;line-height:1}
#flyer .wear.crown{left:42%;top:-14%;font-size:34px}
#flyer .wear.glasses{left:54%;top:22%;font-size:24px}
#flyer .carry{position:absolute;left:55%;top:-40%;font-size:90px;filter:drop-shadow(0 0 18px #FFE680)}
.trailbit{position:fixed;z-index:39;pointer-events:none;font-size:18px;animation:trailfade 1.3s ease-out forwards}
@keyframes trailfade{from{opacity:.85;transform:translate(-50%,-50%) scale(1)}to{opacity:0;transform:translate(-50%,-50%) translateY(14px) scale(.4)}}

/* CelebrationSystem */
.goldsky{position:fixed;inset:0;z-index:38;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 30%,rgba(255,240,160,.95),rgba(255,200,40,.85) 60%,rgba(255,170,0,.8))}
.goldsky.on{animation:goldsky 2.6s ease-in-out forwards}
@keyframes goldsky{0%{opacity:0}25%{opacity:1}75%{opacity:1}100%{opacity:0}}
.goldsky i{position:absolute;width:180px;height:60px;border-radius:60px;background:#FFF6CF;box-shadow:0 0 30px #FFF3B0;animation:rush 1.1s linear infinite}
@keyframes rush{from{transform:translateY(110vh)}to{transform:translateY(-30vh)}}
.yeah{position:fixed;left:50%;top:calc(var(--safe-t) + 18%);z-index:45;transform:translate(-50%,0);font-size:44px;font-weight:700;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 4px 0 var(--ink);pointer-events:none;opacity:0;white-space:nowrap}
.yeah.show{animation:yeah 1.3s forwards}
@keyframes yeah{0%{opacity:0;transform:translate(-50%,20px) scale(.3) rotate(-10deg)}25%{opacity:1;transform:translate(-50%,0) scale(1.15) rotate(3deg)}70%{opacity:1;transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-30px)}}
.flashok{position:fixed;inset:0;z-index:36;pointer-events:none;background:radial-gradient(circle,rgba(255,255,255,0) 40%,rgba(34,197,94,.35));opacity:0}
.flashok.go{animation:fl .5s}
@keyframes fl{30%{opacity:1}}
canvas#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50}
.flycoin{position:fixed;z-index:60;width:30px;height:30px;border-radius:50%;background:var(--coin);display:grid;place-items:center;font-size:16px;box-shadow:0 3px 0 #D59A00;pointer-events:none;transition:transform .7s cubic-bezier(.5,-0.3,.6,1)}

/* overlays: level complete, intro card, farewell */
.over{position:fixed;inset:0;z-index:35;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding-left:16px;padding-right:16px;background:radial-gradient(circle at 50% 30%,rgba(255,246,200,.96),rgba(255,214,77,.96) 60%,rgba(255,178,26,.97))}
.over h1{margin:0;font-size:46px;line-height:1;color:var(--sun);-webkit-text-stroke:2px var(--ink);paint-order:stroke fill;text-shadow:0 5px 0 var(--ink);rotate:-4deg}
.over h2{margin:0;font-size:22px}
.over p{margin:0;font-size:17px;color:var(--muted);font-weight:600}
.learned{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;background:#fff;border-radius:22px;padding:12px;box-shadow:0 6px 0 rgba(0,0,0,.1);max-width:420px}
.learned .lw{display:flex;flex-direction:column;align-items:center;font-size:15px;line-height:1.1;position:relative;min-width:58px}
.learned .lw b{font-size:15px}
.learned .lw i{position:absolute;right:-2px;top:-4px;font-style:normal;font-size:16px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;background:var(--good);color:#fff}
.learned .lw i.half{background:var(--warn)}
.bigstar{font-size:110px;line-height:1;animation:pop .6s both;filter:drop-shadow(0 0 30px #FFF3A0)}
.stars3{font-size:52px;letter-spacing:4px}
.stars3 span{display:inline-block;animation:pop .5s both}
.stars3 span:nth-child(2){animation-delay:.2s}.stars3 span:nth-child(3){animation-delay:.4s}
.stars3 .off{filter:grayscale(1);opacity:.35}
.introcard{display:flex;flex-direction:column;align-items:center;gap:6px;background:#fff;border-radius:28px;padding:18px 22px;box-shadow:0 8px 0 rgba(0,0,0,.12);animation:pop .5s both}
.introcard .tag{font-size:14px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.introcard .ic{font-size:64px;line-height:1}
.introcard b{font-size:28px}
.cloudseat{font-size:120px;line-height:.8;filter:drop-shadow(0 6px 0 rgba(0,0,0,.08))}
.row2{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

/* sheets */
.sheet{position:fixed;inset:0;z-index:70;background:rgba(34,25,47,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--cream);width:100%;max-width:560px;max-height:90vh;overflow-y:auto;border-radius:30px 30px 0 0;padding-block:18px calc(22px + var(--safe-b));display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.panel h2{margin:0;font-size:27px}
.panel p{margin:0;color:var(--muted)}
.closex{align-self:flex-end}
.card{background:#fff;border-radius:22px;padding:14px;box-shadow:0 5px 0 rgba(120,90,0,.08);width:100%;text-align:left}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.stk{aspect-ratio:1;max-width:100%;border-radius:18px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:32px;background:#fff;box-shadow:0 4px 0 rgba(42,33,65,.1);rotate:var(--r,0deg);position:relative}
.stk small{font-size:11px;font-weight:700;color:var(--muted);line-height:1.1}
.stk.no{background:#EFEADB;color:#B9B1A0;font-size:24px;box-shadow:none}
.stk.half::after{content:"";position:absolute;right:6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--warn)}
.medal{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:38px;opacity:.35;filter:grayscale(1)}
.medal.got{opacity:1;filter:none}
.medal small{font-size:12px;font-weight:700;color:var(--ink)}
.lvl{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid #F1E9D2;font-size:15px;font-weight:600}
.lvl:first-of-type{border-top:0}
.lvl .ic{font-size:28px;text-align:center}
.lvl.lock{opacity:.45}
.item{background:#fff;border-radius:20px;padding:12px 6px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;box-shadow:0 5px 0 rgba(0,0,0,.1);border:3px solid transparent}
.item .e{font-size:36px;line-height:1.1}
.item b{font-size:13.5px;line-height:1.1}
.item .price{font-size:15px;font-weight:700;color:#B07C00}
.item.on{border-color:var(--good)}
.item.cant{opacity:.55}
.panel input{width:100%;max-width:320px;border:3px solid var(--sun-deep);border-radius:18px;padding:14px;font:600 22px var(--font);text-align:center;color:var(--ink);background:#fff}
.ages{display:flex;flex-direction:column;gap:10px;width:100%;max-width:400px}
.age{display:grid;grid-template-columns:56px 1fr;gap:10px;align-items:center;text-align:left;background:#fff;border-radius:20px;padding:10px 12px;box-shadow:0 5px 0 rgba(0,0,0,.1);border:3px solid transparent}
.age .e{font-size:40px;text-align:center}
.age b{display:block;font-size:18px}
.age span{font-size:14px;color:var(--muted)}
.age.on{border-color:var(--good)}
.opts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.opt{background:#fff;border-radius:14px;padding:9px 14px;font-weight:700;font-size:16px;box-shadow:0 4px 0 rgba(0,0,0,.1);border:3px solid transparent}
.opt.on{border-color:var(--good)}
.note{font-size:14px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:28px 1fr auto;gap:4px 8px;align-items:center;font-size:15px;font-weight:600}
.mbar{height:10px;border-radius:999px;background:#EFE8D3;overflow:hidden;grid-column:2/4}
.mbar i{display:block;height:100%;background:var(--good);border-radius:999px}
.gate{font-size:30px;font-weight:700}
.lvl .ic{width:36px;height:36px;display:grid;place-items:center;--es:26px;margin:auto}
.stk .sa{width:70%;height:62%;--es:30px}
.learned .lw .la{width:58px;height:58px;--es:40px}
.introcard .ic{width:110px;height:110px;--es:70px}

/* image scenes (BackgroundLayer) */
.bgimg{position:absolute;inset:-12px;background:center/cover no-repeat;filter:blur(2px) saturate(1.1)}
.bgveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 30%,rgba(255,255,255,0) 70%,rgba(255,255,255,.3))}
.art-img{object-fit:contain;-webkit-user-drag:none;user-select:none}
/* lessons (ActivityLayer) */
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;width:min(92vw,420px);justify-items:center}
.choices.n1{grid-template-columns:1fr}
.choices.n3{grid-template-columns:repeat(2,minmax(0,1fr))}
.choices.n3 > :last-child{grid-column:1/-1}
.pick{position:relative;width:100%;max-width:170px;aspect-ratio:1;border-radius:32px;padding:8px;background:radial-gradient(circle at 50% 55%,rgba(255,255,255,.95) 0 58%,rgba(255,255,255,.55) 72%,rgba(255,255,255,0) 74%);animation:peek2 .5s cubic-bezier(.3,1.5,.5,1) both}
.choices.n1 .pick{max-width:230px}
.choices.n3 .pick{max-width:150px}
@keyframes peek2{from{scale:.3;opacity:0}to{scale:1;opacity:1}}
.pick.right{background:radial-gradient(circle at 50% 55%,rgba(220,252,231,.98) 0 58%,rgba(34,197,94,.45) 72%,rgba(34,197,94,0) 74%)}
.glow{animation:glowring 1.1s ease-out infinite!important}
@keyframes glowring{from{box-shadow:0 0 0 0 rgba(255,200,0,.9)}to{box-shadow:0 0 0 26px rgba(255,200,0,0)}}
.r-wave{animation:rwave .9s}
@keyframes rwave{15%{rotate:-10deg}35%{rotate:10deg}55%{rotate:-8deg}75%{rotate:6deg}}
.r-bounce{animation:rbounce .9s}
@keyframes rbounce{20%{translate:0 -60px;scale:1 1.05}40%{translate:0 0;scale:1.1 .9}60%{translate:0 -30px}80%{translate:0 0;scale:1.05 .95}}
.r-drive{animation:rdrive 1s ease-in-out}
@keyframes rdrive{30%{translate:60px 0;rotate:-4deg}60%{translate:-30px 0;rotate:3deg}}
.r-dance{animation:rdance 1s}
@keyframes rdance{20%{rotate:-12deg;scale:1.08}40%{rotate:12deg;translate:0 -14px}60%{rotate:-10deg}80%{rotate:8deg;translate:0 -8px}}
.r-pop{animation:rpop .5s}
@keyframes rpop{40%{scale:1.18}}
.zone{position:relative;width:min(58vw,240px);aspect-ratio:1;border-radius:36px;border:4px dashed rgba(59,42,32,.25);background:rgba(255,255,255,.5);display:grid;place-items:center;padding:12px;transition:background .2s,border-color .2s}
.zone.hot{border-color:var(--sun-deep);background:rgba(255,246,200,.85)}
.zone.house{width:min(46vw,190px)}
.zone.canvas{border-style:solid;border-color:rgba(255,255,255,.9);background:rgba(255,255,255,.7)}
.piece.in-house{transition:transform .6s ease-in,opacity .6s;opacity:0}
.pieces.big .piece{width:min(28vw,124px)}
.zone.track{width:min(90vw,380px);aspect-ratio:auto;height:96px;border:5px solid #3B2A20;border-radius:48px;background:#5B5B66;overflow:hidden}
.zone.track::before{content:"";position:absolute;left:24px;right:70px;top:50%;border-top:6px dashed #FFE066;translate:0 -3px}
.zone.track.hot{background:#6E6E7A}
.track .flag{position:absolute;right:18px;top:16px;width:34px;height:56px;background:conic-gradient(#fff 25%,#222 0 50%,#fff 0 75%,#222 0) 0 0/14px 14px;border:3px solid #3B2A20;border-radius:4px}
.racer{position:absolute;left:0;top:-6px;width:104px;height:104px;animation:race 1.3s ease-in forwards}
@keyframes race{to{translate:calc(min(90vw,380px) - 60px) 0}}
.tintbox{isolation:isolate}
.tintbox .art-img{filter:grayscale(1) brightness(1.15) contrast(1.05);transition:filter .7s}
.tintbox.painted .art-img{filter:grayscale(1) brightness(1.5) contrast(1.15)}
.tintbox .tint{position:absolute;inset:8px;background:var(--c);mix-blend-mode:multiply;-webkit-mask:var(--m) center/contain no-repeat;mask:var(--m) center/contain no-repeat;opacity:0;transition:opacity .7s;pointer-events:none}
.tintbox.painted .tint{opacity:1}
.bigart.tintbox .tint{inset:0}
.chestbox.open{background:radial-gradient(circle at 50% 55%,rgba(255,246,200,.98) 0 58%,rgba(255,200,0,.4) 72%,rgba(255,200,0,0) 74%)}
.altrow{position:absolute;left:0;right:0;bottom:calc(var(--safe-b) + 190px);display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 12px}
.altbtn{display:flex;align-items:center;gap:6px;background:#fff;border-radius:999px;padding:10px 16px;font-weight:700;font-size:20px;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.altbtn.img{width:84px;height:84px;padding:6px;border-radius:24px;justify-content:center}
.altbtn .spk{font-size:18px}
.tramp{position:fixed;left:50%;bottom:calc(var(--safe-b) + 150px);width:230px;translate:-50% 0;z-index:39;pointer-events:none;animation:tin .35s cubic-bezier(.3,1.5,.5,1) both;filter:drop-shadow(0 8px 6px rgba(0,0,0,.2))}
.tramp svg{display:block;width:100%}
.tramp.squash{animation:squash .3s}
.tramp.out{animation:tout .35s forwards}
@keyframes tin{from{scale:.2;opacity:0}to{scale:1;opacity:1}}
@keyframes tout{to{scale:.2;opacity:0}}
@keyframes squash{40%{scale:1.06 .82}}
@media (max-width:370px){.htop .logo{font-size:36px}.tile{font-size:11px}.wcard .w{font-size:24px}.sbubble b{font-size:18px}}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>

/* =====================================================================
   ProgressManager — everything saved on this device only (minimal data)
   ===================================================================== */
const Progress = (() => {
  const blank = () => ({ v:5, name:"", age:"", pos:{ level:0, word:0 }, done:{}, words:{}, coins:0, owned:[], trail:"", wear:"", music:true, voice:"natural", minutes:0, streak:0, lastDay:null, daily:null, medals:[], seenAlbum:0 });
  let K = blank();
  try {
    const s = JSON.parse(localStorage.getItem("destrava_kids") || "null");
    if (s){
      if (s.v === 5) K = Object.assign(blank(), s);
      else if (s.v === 4){ K = Object.assign(blank(), s); K.v = 5; K.pos = { level: Math.max(0, LEVELS.findIndex(l => !K.done[l.id])), word: 0 }; }
      else { // migrate the previous version: keep the child's name, age, coins and powers
        ["name","age","coins","owned","trail","wear","music","streak","lastDay"].forEach(k => { if (s[k] != null) K[k] = s[k]; });
        if (!AGES[K.age]) K.age = "";
        if (K.wear && !SHOP.some(i => i.id === K.wear)) K.wear = "";
        if (K.trail && !SHOP.some(i => i.id === K.trail)) K.trail = "";
      }
    }
  } catch(e){}
  const ymd = d => d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();
  const api = {
    get K(){ return K; },
    save(){ try { localStorage.setItem("destrava_kids", JSON.stringify(K)); } catch(e){} renderHud(); },
    reset(){ try { localStorage.removeItem("destrava_kids"); } catch(e){} try { caches.delete("destrava-kids-voz-v4"); } catch(e){} K = blank(); },
    daily(){ const t = ymd(new Date()); if (!K.daily || K.daily.day !== t) K.daily = { day:t, levels:0, taps:0, speaks:0, claimed:false }; return K.daily; },
    touchDay(){ const t = ymd(new Date()), y = new Date(); y.setDate(y.getDate()-1); if (K.lastDay !== t){ K.streak = K.lastDay === ymd(y) ? K.streak+1 : 1; K.lastDay = t; } api.daily(); },
    stars(){ return Object.values(K.done).reduce((a,b) => a+b, 0); },
    medal(id){ if (!K.medals.includes(id)){ K.medals.push(id); return true; } return false; },
  };
  return api;
})();

/* =====================================================================
   LearningEngine — participation ≠ attempt ≠ approximate ≠ consolidated
   ===================================================================== */
const Learning = (() => {
  const norm = s => String(s).toLowerCase().replace(/[’']/g,"").replace(/[^a-z ]/g," ").replace(/\s+/g," ").trim();
  function lev(a, b){ const m = a.length, n = b.length, d = Array.from({length:m+1}, (_,i) => [i, ...Array(n).fill(0)]); for (let j = 1; j <= n; j++) d[0][j] = j; for (let i = 1; i <= m; i++) for (let j = 1; j <= n; j++) d[i][j] = Math.min(d[i-1][j]+1, d[i][j-1]+1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1)); return d[m][n]; }
  const rec = en => (K().words[en] ||= { seen:0, part:0, tries:0, approx:0, exact:0, tapOk:0, tapBad:0 });
  return {
    /* what the child said: "exact" | "approx" | "attempt" (spoke, not close) | "silence" (heard nothing — never an error) */
    evaluate(alts, target){
      const t = norm(target), xs = (alts || []).map(norm).filter(Boolean);
      if (!xs.length) return "silence";
      if (xs.some(x => (" "+x+" ").includes(" "+t+" "))) return "exact";
      const tol = A().tol, lim = Math.max(1, Math.round(t.length * tol));
      const close = xs.some(x => [x, ...x.split(" ")].some(w => lev(w, t) <= lim) || (t.includes(" ") && lev(x, t) <= lim + 1));
      return close ? "approx" : "attempt";
    },
    seen(en){ rec(en).seen++; },
    said(en, kind){ const r = rec(en); if (kind === "exact") r.exact++; else if (kind === "approx") r.approx++; else if (kind === "attempt") r.tries++; else if (kind === "part") r.part++; },
    tapped(en, ok){ const r = rec(en); ok ? r.tapOk++ : r.tapBad++; },
    cmd(en, ok){ const r = rec(en); ok ? (r.cmdOk = (r.cmdOk || 0) + 1) : (r.cmdBad = (r.cmdBad || 0) + 1); },   // understood a command (find / bring / paint)
    /* 0 new · 1 participated · 2 tried · 3 approximate · 4 consolidated */
    level(en){
      const r = K().words[en]; if (!r) return 0;
      const mini = K().age === "mini";
      if ((r.exact >= 1 || (mini && r.approx >= 1) || r.approx >= 2) && r.tapOk + (r.cmdOk || 0) >= 1) return 4;
      if (r.exact + r.approx >= 1) return 3;
      if (r.tries >= 1) return 2;
      if (r.part + r.seen + r.tapOk >= 1) return 1;
      return 0;
    },
    /* words from earlier levels that are not consolidated yet — they come back for review */
    review(beforeLevel, n){
      const pool = LEVELS.slice(0, beforeLevel).flatMap(levelWords).filter(w => K().words[w.en] && Learning.level(w.en) < 4);
      return shuffle(pool).slice(0, n);
    },
  };
})();

/* =====================================================================
   Audio — natural voice from the server (cached), device voice fallback
   ===================================================================== */
let actx = null, analyser = null, curSrc = null, cloudOffUntil = 0, seq = 0;
const memCache = new Map();
function unlockAudio(){
  try {
    if (!actx){ const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); analyser = actx.createAnalyser(); analyser.fftSize = 512; analyser.connect(actx.destination); }
    if (actx.state !== "running") actx.resume();
    const b = actx.createBuffer(1,1,22050), s = actx.createBufferSource(); s.buffer = b; s.connect(actx.destination); s.start(0);
  } catch(e){}
}
["pointerdown","touchend","keydown"].forEach(ev => document.addEventListener(ev, unlockAudio, { passive:true }));
const VOICE = "Puck";
const VOICE_REV = 2; // trocou a voz do Benjamin (ex.: ElevenLabs)? some 1 aqui para renovar o cache
async function getVoice(text){
  const url = "/api/tts?s=" + A().style + "&v=" + VOICE + "&r=" + VOICE_REV + "&t=" + encodeURIComponent(text);
  if (memCache.has(url)) return memCache.get(url);
  let bytes = null, cache = null;
  try { cache = await caches.open("destrava-kids-voz-v4"); const hit = await cache.match(url); if (hit) bytes = await hit.arrayBuffer(); } catch(e){}
  if (!bytes){
    const r = await fetch(url);
    if (!r.ok){ const d = await r.json().catch(() => ({})); throw { code: d.error || "tts_error", status:r.status }; }
    bytes = await r.arrayBuffer();
    try { cache && await cache.put(url, new Response(bytes.slice(0), { headers:{ "Content-Type": r.headers.get("Content-Type") || "audio/wav" } })); } catch(e){}
  }
  const buf = await new Promise((ok, bad) => { const p = actx.decodeAudioData(bytes.slice(0), ok, bad); if (p && p.then) p.then(ok, bad); });
  memCache.set(url, buf); if (memCache.size > 220) memCache.delete(memCache.keys().next().value);
  return buf;
}
function playBuf(buf, my){
  return new Promise(async res => {
    if (my !== seq) return res();
    try { if (actx.state !== "running") await actx.resume(); } catch(e){}
    const s = actx.createBufferSource(); s.buffer = buf; s.connect(analyser); curSrc = s;
    const guard = setTimeout(end, buf.duration*1000 + 1500);
    function end(){ clearTimeout(guard); if (curSrc === s) curSrc = null; res(); }
    s.onended = end;
    try { s.start(0); } catch(e){ end(); }
  });
}
let voices = [];
const loadVoices = () => { try { voices = speechSynthesis.getVoices() || []; } catch(e){} };
if ("speechSynthesis" in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
/* device voice (only when the natural voice is unavailable): English parts are read by an English voice,
   Portuguese parts by a Brazilian one — so "Dad!" is never spelled out letter by letter */
const EN_EXTRA = "find the bring home who is this where's where what color can you say look at my toys new let's meet family paint make it yes great good job wow try again almost a an toy yeahhh uhuul i love";
let EN_VOCAB = null;
function isEnglish(seg){
  if (!EN_VOCAB){ EN_VOCAB = new Set(EN_EXTRA.split(" ")); LEVELS.forEach(l => l.words.forEach(([en]) => en.toLowerCase().split(" ").forEach(t => EN_VOCAB.add(t)))); }
  const toks = seg.toLowerCase().replace(/[’']/g, "'").replace(/[^a-z' ]/g, " ").split(/\s+/).filter(Boolean);
  if (!toks.length || /[ãõáéíóúâêôç]/i.test(seg)) return false;
  return toks.every(t => EN_VOCAB.has(t) || EN_VOCAB.has(t.replace(/'s$/, "")));
}
function pickVoice(lang){
  const sc = v => (/premium|enhanced|aprimorad|melhorad|natural/i.test(v.name) ? 4 : 0) + (/google|samantha|felipe|daniel|luciana/i.test(v.name) ? 1 : 0);
  return voices.filter(v => (v.lang || "").toLowerCase().replace("_", "-") === lang).sort((a, b) => sc(b) - sc(a))[0];
}
function speakOne(text, lang){
  return new Promise(res => {
    const u = new SpeechSynthesisUtterance(text); u.lang = lang; u.rate = (K().age === "mini" ? .86 : .96) * (lang === "en-US" ? .92 : 1); u.pitch = 1.3;
    const v = pickVoice(lang.toLowerCase()); if (v) u.voice = v;
    const g = setTimeout(res, 2500 + text.length * 110); u.onend = u.onerror = () => { clearTimeout(g); res(); };
    try { speechSynthesis.speak(u); } catch(e){ res(); }
  });
}
async function deviceSay(text){
  if (!("speechSynthesis" in window)) return;
  const segs = text.split(/(?<=[!?.])\s+/).filter(Boolean);
  for (const seg of segs){ const my = seq; await speakOne(seg, isEnglish(seg) ? "en-US" : "pt-BR"); if (my !== seq) return; }
}
let talkingSynthetic = false;
async function say(text){
  if (!text) return;
  const my = seq; unlockAudio();
  if (actx && K().voice !== "device" && Date.now() > cloudOffUntil){
    try { const buf = await getVoice(text); if (my !== seq) return; Hero.talk(true); await playBuf(buf, my); if (my === seq) Hero.talk(false); return; }
    catch(e){ if (my !== seq) return; cloudOffUntil = Date.now() + 3*60*1000; }
  }
  if (my !== seq) return;
  talkingSynthetic = true; Hero.talk(true); await deviceSay(text); talkingSynthetic = false; Hero.talk(false);
}
function hush(){ seq++; try { curSrc && curSrc.stop(); } catch(e){} curSrc = null; try { speechSynthesis.cancel(); } catch(e){} talkingSynthetic = false; Hero.talk(false); }
function prefetch(lines){ if (!actx || K().voice === "device") return; (async () => { for (const t of lines.slice(0, 8)){ try { await getVoice(t); } catch(e){ return; } } })(); }
function level01(){ // loudness of Benjamin's voice right now, 0..1 (drives his mouth)
  if (talkingSynthetic) return .35 + .35 * Math.abs(Math.sin(performance.now() / 85));
  if (!analyser || !curSrc) return 0;
  const d = new Uint8Array(analyser.fftSize); analyser.getByteTimeDomainData(d);
  let s = 0; for (let i = 0; i < d.length; i++){ const v = (d[i]-128)/128; s += v*v; } return Math.min(1, Math.sqrt(s / d.length) * 4);
}

/* sound effects */
function tone(f, d, at = 0, type = "triangle", v = .18, slide){
  if (!actx) return; const t0 = actx.currentTime + at;
  const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(f, t0); if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + d);
  g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(v, t0 + .01); g.gain.exponentialRampToValueAtTime(.001, t0 + d);
  o.connect(g); g.connect(actx.destination); o.start(t0); o.stop(t0 + d + .02);
}
const sfx = {
  boing:() => tone(330, .22, 0, "sine", .22, 660),
  sparkle:() => [1568, 2093, 2637].forEach((f, i) => tone(f, .12, i * .06, "sine", .07)),
  pop:  () => { tone(900, .12, 0, "sine", .25, 1800); tone(1400, .08, .03, "sine", .12); },
  coin: () => { tone(988, .08, 0, "square", .05); tone(1319, .22, .07, "square", .05); },
  ok:   () => { tone(660, .12, 0); tone(880, .12, .09); tone(1320, .25, .18); },
  soft: () => tone(420, .18, 0, "sine", .12, 360),
  flip: () => tone(520, .07, 0, "sine", .15, 760),
  whoosh:() => tone(260, .45, 0, "sine", .1, 1300),
  listen:() => tone(740, .1, 0, "sine", .12, 990),
  win:  () => [523,659,784,1047].forEach((f, i) => tone(f, i === 3 ? .5 : .16, i * .15)),
  star: () => { tone(200, .6, 0, "sawtooth", .04, 900); [784, 988, 1175, 1568, 2093].forEach((f, i) => tone(f, .35, .5 + i * .09, "triangle", .12)); },
};
/* background music: original upbeat instrumental loop, quiet, ducks under the voice */
const NOTE = n => 440 * Math.pow(2, (n - 69) / 12);
const CHORDS = [ [48, [60,64,67]], [43, [59,62,67]], [45, [60,64,69]], [41, [60,65,69]] ];
const HOOK = [ [0,72],[2,76],[3,79],[4,76],[6,74], [8,71],[10,74],[11,79],[12,74],[14,71], [16,72],[18,76],[19,81],[20,79],[22,76], [24,77],[26,76],[27,74],[28,72] ];
let musicGain = null, musicTimer = null, mStep = 0, mNext = 0, noiseBuf = null;
const STEP = 60 / 116 / 2, MVOL = .045, MDUCK = .012;
function mvoice(freq, at, dur, type, vol){ const o = actx.createOscillator(), g = actx.createGain(); o.type = type; o.frequency.setValueAtTime(freq, at); g.gain.setValueAtTime(0, at); g.gain.linearRampToValueAtTime(vol, at + .008); g.gain.exponentialRampToValueAtTime(.0008, at + dur); o.connect(g); g.connect(musicGain); o.start(at); o.stop(at + dur + .02); }
function kick(at){ const o = actx.createOscillator(), g = actx.createGain(); o.frequency.setValueAtTime(130, at); o.frequency.exponentialRampToValueAtTime(45, at + .12); g.gain.setValueAtTime(.9, at); g.gain.exponentialRampToValueAtTime(.001, at + .16); o.connect(g); g.connect(musicGain); o.start(at); o.stop(at + .18); }
function hat(at, vol){
  if (!noiseBuf){ noiseBuf = actx.createBuffer(1, actx.sampleRate * .05, actx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random()*2 - 1; }
  const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain(); s.buffer = noiseBuf; f.type = "highpass"; f.frequency.value = 7000;
  g.gain.setValueAtTime(vol, at); g.gain.exponentialRampToValueAtTime(.001, at + .04); s.connect(f); f.connect(g); g.connect(musicGain); s.start(at);
}
function musicOn(){
  if (!actx || musicTimer || !K().music) return;
  if (!musicGain){ musicGain = actx.createGain(); musicGain.connect(actx.destination); }
  musicGain.gain.setValueAtTime(MVOL, actx.currentTime);
  mNext = actx.currentTime + .1;
  musicTimer = setInterval(() => {
    while (mNext < actx.currentTime + .5){
      const bar = Math.floor(mStep / 8) % 4, st = mStep % 8, [root, tri] = CHORDS[bar], loop = Math.floor(mStep / 32);
      if ([0, 3, 4, 6].includes(st)) mvoice(NOTE(root + (st === 6 ? 7 : 0)), mNext, STEP * 1.6, "triangle", .55);
      if (st % 2 === 1) tri.forEach(n => mvoice(NOTE(n), mNext, STEP * .9, "square", .05));
      if (st === 0 || st === 4) kick(mNext);
      hat(mNext, st % 2 ? .12 : .06);
      if (loop % 2 === 0){ const h = HOOK.find(([pos]) => pos === (mStep % 32)); if (h) mvoice(NOTE(h[1]), mNext, STEP * 1.8, "triangle", .32); }
      else if (st % 2 === 0) mvoice(NOTE(tri[(st / 2) % 3] + 12), mNext, STEP * 1.2, "sine", .18);
      mNext += STEP; mStep++;
    }
  }, 100);
}
function musicOff(){ clearInterval(musicTimer); musicTimer = null; if (musicGain) try { musicGain.gain.setTargetAtTime(0, actx.currentTime, .1); } catch(e){} }
function duck(on){ if (!musicGain || !actx || !musicTimer) return; try { musicGain.gain.setTargetAtTime(on ? MDUCK : MVOL, actx.currentTime, .15); } catch(e){} }

/* =====================================================================
   HeroCharacter — Super Benjamin
   · close-up camera: pose sprites (teach / call / yeah / almost) with real
     blinking eyelids, a mouth driven by his own voice, breathing, head tilt and lean-in
   · flyer: full body for entrances, celebrations and the special achievement
   POSES is the slot for more art: add a sprite + its eye/mouth boxes and the
   emotion controller can use it (visemes, pointing gestures, 3D later).
   ===================================================================== */
const Hero = (() => {
  // Super Benjamin is always the full flying hero, loose in the air (no frame).
  // modes: "follow" (hovers beside the thing he is showing), "wander" (drifts lazily over the scene while the child plays),
  //        "glide"/"dash" (flying to a point for a moment)
  const fly = { el: $("#flyer"), x: innerWidth * .8, y: innerHeight * .3, vx:0, vy:0, tx:null, ty:null, size:120, cur:120, mode:"wander", base:"wander", target:null, actT:0, act:null, dir:1, lastTrail:0, onDone:null, tilt:0, tiltT:0, lean:1, leanT:1, talking:false, last:0 };
  function flyerWear(){ fly.el.querySelectorAll(".wear").forEach(w => w.remove()); const it = SHOP.find(i => i.id === K().wear); if (it) fly.el.append(el("span","wear " + it.id, it.e)); }
  function frame(now){
    const dt = Math.min(.05, (now - (fly.last || now)) / 1000); fly.last = now;
    if (!fly.el.hidden){
      const t = now / 1000, W = innerWidth, H = innerHeight, s = fly.cur;
      let tx = fly.tx, ty = fly.ty, k = 2.2;
      if (fly.mode === "follow" && fly.target && fly.target.isConnected){
        const r = fly.target.getBoundingClientRect();
        tx = Math.min(W - s * .42, r.right + s * .2) + Math.sin(t * .5) * 12;
        ty = Math.max(70 + s * .3, r.top + s * .15) + Math.sin(t * .7) * 8;
        k = 2.4;
      } else if (fly.mode === "follow" || fly.mode === "wander"){
        tx = W * (.5 + .3 * Math.sin(t * .3)); ty = 118 + s * .38 + Math.sin(t * .55) * 12; k = 1.1;
      } else if (fly.mode === "dash") k = 6;
      fly.vx += (((tx ?? fly.x) - fly.x) * k - fly.vx * 2.5) * dt; fly.vy += (((ty ?? fly.y) - fly.y) * k - fly.vy * 2.5) * dt;
      fly.x += fly.vx * dt; fly.y += fly.vy * dt;
      const speed = Math.hypot(fly.vx, fly.vy);
      if (fly.vx > 25) fly.dir = 1; else if (fly.vx < -25) fly.dir = -1;
      if (fly.mode === "follow" && speed < 40) fly.dir = -1;   // looks at what he is showing
      fly.cur += (fly.size - fly.cur) * .1; fly.el.style.width = fly.cur + "px";
      fly.tilt += (fly.tiltT - fly.tilt) * .08; fly.lean += (fly.leanT - fly.lean) * .08;
      const talk = fly.talking ? level01() : 0;
      let oy = reduceMotion ? 0 : Math.sin(t * 1.6) * 5 - talk * 6;
      let rot = Math.max(-16, Math.min(16, fly.vy * .08)) * fly.dir + fly.tilt * fly.dir + (reduceMotion ? 0 : Math.sin(t * .8) * 1.5);
      let sc = fly.lean * (1 + talk * .035);
      if (fly.act){
        fly.actT += dt; const p = fly.actT;
        if (fly.act === "flip"){ const q = Math.min(1, p / 1.1); oy -= Math.sin(Math.PI * q) * 60; rot += 360 * q * fly.dir; sc *= 1 + Math.sin(Math.PI * q) * .15; if (p >= 1.1){ fly.act = null; fly.onDone && fly.onDone(); } }
        else if (fly.act === "wave"){ rot += Math.sin(p * 6) * 6; }
        else if (fly.act === "tramp"){   // golden trampoline: 3 bounces, the last one with a somersault
          const D = 2.7, q = Math.min(1, p / D), f = q * 3, i = Math.min(2, Math.floor(f)), fr = f - Math.floor(f);
          oy -= Math.sin(Math.PI * (q >= 1 ? 1 : fr)) * [110, 150, 200][i]; if (i === 2) rot += 360 * fr * fly.dir;
          if (i !== fly.lastBounce && q < 1){ fly.lastBounce = i; fly.onBounce && fly.onBounce(); }
          if (p >= D){ fly.act = null; fly.lastBounce = -1; fly.onDone && fly.onDone(); }
        }
      }
      fly.el.style.transform = `translate(${fly.x - s/2}px, ${fly.y - s*.45 + oy}px) rotate(${rot}deg) scale(${sc * fly.dir}, ${sc})`;
      if (K().trail && !reduceMotion && now - fly.lastTrail > 300 && speed > 110){
        fly.lastTrail = now; const it = SHOP.find(i => i.id === K().trail);
        if (it){ const b = el("span","trailbit", it.e); b.style.left = (fly.x - fly.dir * s * .42) + "px"; b.style.top = (fly.y + s * .12) + "px"; document.body.append(b); setTimeout(() => b.remove(), 1300); }
      }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const Voice = (() => {

    mic.dataset.s = s; if (caption != null) cap.textContent = caption;
    clearInterval(barsT);
    if (s === "listening") barsT = setInterval(() => [...bars.children].forEach(b => b.style.setProperty("--h", (8 + Math.random() * 22) + "px")), 120);
  }
  return {
    get available(){ return srOk; },
    setState,
    /* resolves { kind: "heard", alts } | { kind: "silence" } | { kind: "unavailable" } */
    listen(maxMs = 7000){

}

          p.addEventListener("pointerdown", e => { p.setPointerCapture(e.pointerId); sx = e.clientX; sy = e.clientY; dragging = false; });

        await bubbles(dad, [mom, grandma, grandpa]);
      }
      else if (L.script === "toys"){
        const [ball, car, teddy] = ["ball","car","teddy bear"].map(byEn), doll = byEn("doll"), bike = byEn("bike");
        await discover([ball, car, teddy], "Look at my toys!", { ball:"bounce", car:"drive", "teddy bear":"dance" });

        const track = el("div","zone track"); track.innerHTML = '<span class="flag"></span>';
        await drag(car, mini ? [car, ball] : [car, ball, teddy], "Make the car go!", track, async p => { const c = el("div","racer"); c.innerHTML = ART.html(car.e); track.append(c); p.remove(); sfx.whoosh(); await wait(1300); });
        await seek(teddy, [ball, car], "Where's the teddy bear?");

        await oral(ball, "Can you say ball?", [ball, car].concat(mini ? [] : [teddy]));
        if (doll && bike) await discover([doll, bike], "New toys!", { doll:"dance", bike:"drive" });
        await choose(car, [car, ...shuffle([ball, teddy, doll, bike].filter(Boolean)).slice(0, n - 1)], "Find the car!", { react:"drive" });
        const fam = LEVELS.find(l => l.id === "aula-family");
        const famWords = fam ? fam.words.slice(0, 2).map(([en, pt, e]) => W_(en, pt, e)) : [];
        await bubbles(teddy, [ball, car].concat(famWords));
      }
      else if (L.script === "colors"){
        const C = ["red","blue","yellow","green"].map(byEn), [red, blue, yellow, green] = C, pink = byEn("pink");
        const toy = k => ({ en:k, e:k });
        await discover(C, "Let's paint!", { red:"pop", blue:"pop", yellow:"pop", green:"pop" });

        await drag(red, mini ? [red, blue] : [red, blue, yellow], "Make it red!", carBox, async p => { p.remove(); carBox.classList.add("painted"); sfx.sparkle(); await wait(500); react(carBox, "drive"); await wait(700); }, { make: pot });
        const ballBox = tinted(toy("soccer"), PAINT.blue); ballBox.classList.add("zone","canvas"); ballBox.disabled = true;
        await drag(blue, mini ? [blue, red] : [blue, red, green], "Paint the ball blue!", ballBox, async p => { p.remove(); ballBox.classList.add("painted"); sfx.sparkle(); await wait(500); react(ballBox, "bounce"); await wait(700); }, { make: pot });
        await Celebrate.trampoline();
        // find the yellow toy (colour + toy words together)
        const toys = [["teddy","yellow"],["car","red"],["ball","blue"],["robot","green"]];
        const yellowSet = [yellow, red, blue, green].slice(0, n).map((c, i) => Object.assign({}, c, { obj: toys.find(t => t[1] === c.en)[0] }));
        await choose(yellow, yellowSet, "Find the yellow toy!", { make: c => tinted(toy(c.obj), PAINT[c.en], true), react:"dance" });
        const greenSet = [green, red, blue, yellow].slice(0, n).map(c => Object.assign({}, c, { obj: toys.find(t => t[1] === c.en)[0] }));
        await choose(green, greenSet, "Find the green toy!", { make: c => tinted(toy(c.obj), PAINT[c.en], true), react:"dance" });
        // what colour? (touch alternative: the paint pots)
        run.paintObj = toy("teddy");
        await oral(red, "What color?", [red, blue].concat(mini ? [] : [yellow]).map(c => Object.assign({}, c, { paint: c.e })), "tint");
        if (pink) await discover([pink], "Look! Pink!", { pink:"pop" });
        await bubbles(blue, [red, yellow, green]);
      }
    } catch (e){ if (e === STOP) return; throw e; }
    if (run && run.token === my) finishLevel();
  }

  /* entering the adventure */
  async function start(idx, resumeAt = 0){
    hush(); Voice.stop();
    const L = LEVELS[idx], W = WORLDS[L.world];
    const words = L.kind === "lesson" ? L.words.slice(0, L.core).map(([en, pt, e]) => ({ en, pt, e })) : levelWords(L);
    if (L.kind === "lesson") resumeAt = 0;
    run = { idx, i: Math.min(resumeAt, words.length - 1), words, allWords: L.words.map(([en, pt, e]) => ({ en, pt, e })), token: Math.random(), waitingMic:null, helped:false };
    K().pos = { level: idx, word: run.i }; Progress.touchDay(); Progress.save();
    $("#home").hidden = true; adv.hidden = false; $("#over").hidden = true;
    Scene.render(L.world, L.scene); renderDots(); clearAll(); sub.hidden = true; showMic(false); adv.classList.remove("play");
    musicOn(); Voice.setState("off", "");
    const w0 = words[run.i];
    prefetch(L.kind === "lesson" ? [L.title + "!", w0.en + "! " + w0.pt + "!", "Try again!", "Yes!", "Great!"] : [L.title + "!", "Toca na bolha!", w0.en + "! " + w0.pt + "!", "Fala: " + w0.en + "!", "Pega o " + w0.en + "!"]);
    // entrance: the world appears, Benjamin flies in with a somersault
    const o = $("#over"); o.textContent = ""; o.hidden = false; o.style.background = "transparent";
    const ic = el("div","introcard"); const art = el("span","ic"); art.innerHTML = ART.html(L.icon);
    ic.append(el("span","tag", W.name), art, el("b", null, "Nível " + (idx + 1) + ": " + L.title)); o.append(ic);
    Hero.size(150); Hero.flyer.show(150); Hero.flyer.place(innerWidth + 120, innerHeight * .2); sfx.whoosh();
    const my = run.token;
    Hero.flyer.to(innerWidth * .5, innerHeight * .2, "dash").then(() => Hero.flyer.flip());
    const firstVisit = !Object.keys(K().done).some(id => LEVELS.find(l => l.id === id)?.world === L.world);
    await say((firstVisit ? W.name + "! " : "") + L.title + "!");
    if (my !== run.token) return;
    await wait(500); if (my !== run.token) return;
    o.hidden = true; o.style.background = "";
    Hero.size(K().age === "mini" ? 130 : 120);
    if (L.kind === "lesson") lessonRun(L); else teachWord(words[run.i]);
  }

  /* side buttons */
  $("#repeatBtn").onclick = () => { if (!run) return; const w = run.words[run.i]; if (!w) return; hush(); say(w.en + "!"); };
  $("#helpBtn").onclick = async () => { if (!run) return; const w = run.words[run.i]; if (!w) return; hush(); Voice.stop(); Emotion.set("help"); await say(w.en + "! " + w.en + "!"); Voice.setState("help", "Toca no microfone 🎤"); run.waitingMic = run.waitingMic || (async () => { run.waitingMic = null; Voice.setState("listening", "Estou ouvindo…"); Emotion.set("listening"); const my = run.token; const r = await Voice.listen(); if (my === run.token) handleResult(w, r, 0); }); showSkip(w); };
  $("#mic").onclick = () => {
    if (!run) return;
    if (run.waitingMic){ hush(); run.waitingMic(); return; }
    if ($("#mic").dataset.s === "listening") return;
    if (!Voice.available){ Voice.setState("off", "Fala bem alto e toca em “Eu falei!”"); $("#saidBtn").hidden = false; }
  };
  $("#advBack").onclick = () => { stop(); goHome(); };
  function stop(){ if (run) run.token = Math.random(); hush(); Voice.stop(); Hero.flyer.hide(); $("#over").hidden = true; clearAll(); }
  return { start, stop, get running(){ return !!run; }, farewell };
})();
const P = () => Progress.daily();

const face = s => { const i = el("img"); i.src = "/hero-face.png"; i.alt = ""; i.style.cssText = `width:${s}px;height:${s}px;border-radius:50%;border:4px solid #fff;box-shadow:0 4px 0 rgba(0,0,0,.1)`; return i; };
